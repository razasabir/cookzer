name: Android build

# Cookzer's Android app is a Capacitor shell that loads the live site
# (capacitor.config.json -> server.url) — it has no bundled copy of the
# web pages to go stale, so this workflow only needs to run when the
# native shell itself changes (icons, permissions, Capacitor config),
# not on every ordinary website change. Builds an unsigned debug APK,
# good enough to sideload onto a device or emulator to check the shell
# actually works. Release signing (needed for the real Play Store
# upload) isn't wired up yet — see the comment on the release job below
# for what that needs once a Play Console account + keystore exist.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cookzer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Runs only once these 4 secrets exist in the repo (Settings -> Secrets
  # and variables -> Actions). To create them: generate a release keystore
  # once with `keytool -genkey -v -keystore cookzer-release.keystore
  # -alias cookzer -keyalg RSA -keysize 2048 -validity 10000`, store that
  # .keystore file somewhere safe outside the repo (losing it means you
  # can never publish an update to the same app listing again), then set
  # ANDROID_KEYSTORE_BASE64 (base64 of the .keystore file), plus
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.
  # Produces a signed .aab, the format Play Console actually accepts.
  release-aab:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && vars.ANDROID_RELEASE_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap sync android
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: cookzer-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
