name: Android build

# Cookzer's Android app is a Capacitor shell that loads the live site
# (capacitor.config.json -> server.url) — it has no bundled copy of the
# web pages to go stale, so this workflow only needs to run when the
# native shell itself changes (icons, permissions, Capacitor config),
# not on every ordinary website change. Builds an unsigned debug APK,
# good enough to sideload onto a device or emulator to check the shell
# actually works. Release signing (needed for the real Play Store
# upload) isn't wired up yet — see the comment on the release job below
# for what that needs once a Play Console account + keystore exist.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish/update the android-latest release below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      # Gradle's own output filename ("app-debug.apk") is a build-tool
      # artifact name, not something to hand a user downloading the app —
      # rename it once here so every download (and both upload steps
      # below) gets the same clean, human-facing name.
      - name: Rename APK for distribution
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Cookzer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cookzer-debug-apk
          path: android/app/build/outputs/apk/debug/Cookzer.apk
      # Gives the website a stable public download link
      # (github.com/razasabir/cookzer/releases/download/android-latest/Cookzer.apk)
      # that doesn't change every build — this action updates the same
      # "android-latest" release in place rather than creating a new one
      # each time. This is a debug build (no Play Console account/signing
      # keystore yet), so it's for direct download while that's set up,
      # not the eventual Play Store listing.
      - name: Publish to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Cookzer for Android (latest build)
          body: |
            Automatically rebuilt from the latest `main` on every push that
            touches the native app shell. This is a debug build for direct
            download from the website while the Google Play listing is
            still being set up — Android will show an "unknown sources"
            warning on install, which is expected for a sideloaded app.
          prerelease: true
          files: android/app/build/outputs/apk/debug/Cookzer.apk

  # Runs only once these 4 secrets exist in the repo (Settings -> Secrets
  # and variables -> Actions). To create them: generate a release keystore
  # once with `keytool -genkey -v -keystore cookzer-release.keystore
  # -alias cookzer -keyalg RSA -keysize 2048 -validity 10000`, store that
  # .keystore file somewhere safe outside the repo (losing it means you
  # can never publish an update to the same app listing again), then set
  # ANDROID_KEYSTORE_BASE64 (base64 of the .keystore file), plus
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.
  # Produces a signed .aab, the format Play Console actually accepts.
  release-aab:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && vars.ANDROID_RELEASE_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap sync android
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: cookzer-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
