name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Without this, every push to a PR queues a brand-new ~full-length run
# without touching the previous one, so a few quick follow-up commits
# leave several runs genuinely executing at once for the same PR — only
# the latest ever matters for merge gating, so the rest are pure waste
# (and, worse, extra queued runs delay the one that actually counts).
# Cancel whatever's still running in the same PR/branch when a new run
# for it starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The Chromium download (the slow part) is skipped whenever the
      # pinned @playwright/test version hasn't changed; the runner VM is
      # fresh every run, so the system deps step below still has to run
      # regardless of the cache — it's just an apt install, not a download.
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright's system deps (cache hit — browser already downloaded)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
