<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Messenger — Cookzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth-guard.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
  .sidebar-title {
      padding: 0 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 12px;
    }

  .brand-header {
      font-size: 24px;
      color: var(--olive-dark);
      letter-spacing: -0.5px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
    }

  .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mustard), var(--brick));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

  /* Main content */
    .main {
      flex: 1;
      margin-left: 280px;
      margin-top: 60px;
      display: flex;
      overflow: hidden;
    }

  /* Messenger layout */
    .msg-list {
      width: 320px;
      flex-shrink: 0;
      background: var(--card-bg);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }

  .msg-list-header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      font-family: 'Fraunces', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--olive-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

  .new-msg-btn {
      font-family: 'Work Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--olive);
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 6px 12px;
      cursor: pointer;
    }

  .new-msg-btn:hover { background: #f0e6d2; }

  .new-msg-panel {
      display: none;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--cream);
    }

  .new-msg-panel.open { display: block; }

  .new-msg-panel input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      font-size: 13px;
      font-family: inherit;
      color: var(--ink);
      background: var(--card-bg);
      margin-bottom: 8px;
    }

  .new-msg-result {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
      cursor: pointer;
      border-radius: 14px;
      font-size: 13px;
    }

  .new-msg-result:hover { background: var(--card-bg); }

  .new-msg-empty {
      font-size: 12px;
      color: var(--ink-soft);
      padding: 4px 6px;
    }

  .conversation {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      border-bottom: 1px solid var(--line);
      transition: background 0.15s;
    }

  .conversation:hover {
      background: var(--cream);
    }

  .conversation.active {
      background: rgba(78, 90, 62, 0.06);
      border-left-color: var(--olive);
    }

  .conv-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mustard), var(--brick));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

  .conv-meta {
      flex: 1;
      min-width: 0;
    }

  .conv-name-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

  .conv-name {
      font-size: 14px;
      color: var(--ink);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

  .conv-time {
      font-size: 11px;
      color: var(--ink-soft);
      flex-shrink: 0;
    }

  .conv-preview {
      font-size: 12px;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

  .conversation.unread .conv-name,
    .conversation.unread .conv-preview {
      color: var(--ink);
      font-weight: 600;
    }

  .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brick);
      flex-shrink: 0;
      margin-left: 6px;
    }

  /* Thread pane */
    .msg-thread {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

  .thread-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--card-bg);
      flex-shrink: 0;
    }

  .thread-back {
      display: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--cream);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

  .thread-name {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
    }

  .thread-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

  .bubble-row {
      display: flex;
    }

  .bubble-row.sent { justify-content: flex-end; }

  .bubble-row.received { justify-content: flex-start; }

  .bubble-wrap {
      max-width: 70%;
      display: flex;
      flex-direction: column;
    }

  .bubble-row.sent .bubble-wrap { align-items: flex-end; }

  .bubble-row.received .bubble-wrap { align-items: flex-start; }

  .bubble {
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: break-word;
      word-break: break-word;
    }

  .bubble-row.received .bubble {
      background: var(--card-bg);
      border: 1px solid var(--line);
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }

  .bubble-row.sent .bubble {
      background: var(--olive);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

  .bubble-time {
      font-size: 10px;
      color: var(--ink-soft);
      margin-top: 4px;
      text-align: right;
    }

  .bubble-row.received .bubble-time { text-align: left; }

  .thread-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-soft);
      font-size: 14px;
      text-align: center;
      padding: 40px;
    }

  .thread-input {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--line);
      background: var(--card-bg);
      flex-shrink: 0;
    }

  .thread-input input {
      flex: 1;
      padding: 10px 16px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 20px;
      font-size: 13px;
      color: var(--ink);
      font-family: inherit;
    }

  .thread-input input::placeholder {
      color: var(--ink-soft);
    }

  .thread-send {
      background: var(--olive);
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

  .thread-send:hover {
      background: var(--olive-dark);
    }

  /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

  /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        height: 100vh;
        z-index: 100;
        transition: left 0.25s ease;
      }
      .sidebar.open { left: 0; }
      .sidebar-overlay.open { display: block; }
      .menu-toggle { display: flex; }
      .header { left: 0; padding: 0 16px; gap: 12px; }
      .main { margin-left: 0; }
      .brand-header { font-size: 18px; }

      /* Single-pane messenger: list by default, thread when a conversation is open */
      .msg-list { width: 100%; }
      .msg-thread { display: none; }
      .thread-back { display: flex; }

      .messenger.thread-open .msg-list { display: none; }
      .messenger.thread-open .msg-thread { display: flex; }
    }

  @media (max-width: 480px) {
      .header { padding: 0 12px; }
      .icon-btn, .avatar { width: 32px; height: 32px; font-size: 15px; }
      .bubble-wrap { max-width: 85%; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div style="padding: 0 16px; margin-bottom: 20px;">
    <a href="cookzer-feed.html" style="text-decoration: none;"><div style="font-size: 22px; font-family: 'Fredoka', sans-serif; font-weight: 600; color: var(--olive-dark);">Cook<span style="color: var(--brick);">zer</span></div></a>
  </div>

  <a href="cookzer-feed.html" style="text-decoration: none;"><div class="sidebar-item icon feed">Feed</div></a>
  <a href="cookzer-cookbook.html" style="text-decoration: none;"><div class="sidebar-item icon cookbook">My Recipes</div></a>
  <a href="cookzer-planner.html" style="text-decoration: none;"><div class="sidebar-item icon planner">Meal Planner</div></a>
  <a href="cookzer-challenges.html" style="text-decoration: none;"><div class="sidebar-item icon challenges">Challenges</div></a>
  <a href="cookzer-profile.html" style="text-decoration: none;"><div class="sidebar-item icon profile">Profile</div></a>
  <a href="cookzer-messenger.html" style="text-decoration: none;"><div class="sidebar-item icon messenger active">Messenger</div></a>

  <div class="sidebar-title" style="margin-top: 24px;">Your Network</div>
  <div style="padding: 0 16px;">
    <div style="font-size: 12px; color: var(--ink-soft); margin-bottom: 8px;">Recently active</div>
  </div>

  <div class="sidebar-item" style="display: flex; gap: 10px; align-items: center;">
    <div style="width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #D9A441, #A94E2E); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600;">SK</div>
    <span>Sarah K.</span>
  </div>

  <div class="sidebar-item" style="display: flex; gap: 10px; align-items: center;">
    <div style="width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #D9A441, #A94E2E); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600;">AM</div>
    <span>Amina M.</span>
  </div>

  <div class="sidebar-item" style="display: flex; gap: 10px; align-items: center;">
    <div style="width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #D9A441, #A94E2E); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600;">JM</div>
    <span>Josh M.</span>
  </div>
</div>

<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Header -->
<div class="header">
  <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
  <div class="brand-header">Cook<span>zer</span></div>
  <div class="header-right">
    <button class="icon-btn">🔔</button>
    <a href="cookzer-messenger.html" style="text-decoration: none;"><button class="icon-btn">💬</button></a>
    <div class="avatar">RZ</div>
  </div>
</div>

<!-- Main content -->
<div class="main">
  <div class="messenger" id="messenger">
    <div class="msg-list" id="convList">
      <div class="msg-list-header">
        Messages
        <button class="new-msg-btn" id="newMsgBtn" type="button">+ New</button>
      </div>
      <div class="new-msg-panel" id="newMsgPanel">
        <input type="text" id="newMsgSearch" placeholder="Search people by name...">
        <div id="newMsgResults"></div>
      </div>
      <!-- conversation items rendered by JS -->
    </div>

    <div class="msg-thread" id="thread">
      <div class="thread-empty" id="threadEmpty">Select a conversation to start chatting.</div>
    </div>
  </div>
</div>

<script>
  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.querySelector('.sidebar-overlay').classList.toggle('open');
  }

  let currentUser = null;
  let conversations = []; // [{ id, name, initials, otherId, lastText, lastTime, unread }]
  let activeId = null;
  let activeChannel = null;

  function formatTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  async function loadConversations() {
    const { data: mine, error: mineErr } = await sb
      .from('conversation_participants')
      .select('conversation_id, last_read_at')
      .eq('user_id', currentUser.id);

    if (mineErr || !mine || mine.length === 0) {
      conversations = [];
      return;
    }

    const convIds = mine.map((m) => m.conversation_id);
    const readMap = Object.fromEntries(mine.map((m) => [m.conversation_id, m.last_read_at]));

    const { data: others } = await sb
      .from('conversation_participants')
      .select('conversation_id, user_id, profiles(display_name, initials)')
      .in('conversation_id', convIds)
      .neq('user_id', currentUser.id);

    const { data: allMessages } = await sb
      .from('messages')
      .select('conversation_id, text, created_at')
      .in('conversation_id', convIds)
      .order('created_at', { ascending: false });

    const latestByConv = {};
    (allMessages || []).forEach((m) => {
      if (!latestByConv[m.conversation_id]) latestByConv[m.conversation_id] = m;
    });

    conversations = (others || []).map((o) => {
      const last = latestByConv[o.conversation_id];
      const lastReadAt = readMap[o.conversation_id];
      return {
        id: o.conversation_id,
        otherId: o.user_id,
        name: o.profiles ? o.profiles.display_name : 'Unknown',
        initials: o.profiles ? o.profiles.initials : '??',
        lastText: last ? last.text : 'Say hello!',
        lastTime: last ? formatTime(last.created_at) : '',
        unread: !!(last && (!lastReadAt || new Date(last.created_at) > new Date(lastReadAt))),
      };
    });

    conversations.sort((a, b) => (a.lastTime < b.lastTime ? 1 : -1));
  }

  function renderList() {
    const listEl = document.getElementById('convList');
    listEl.querySelectorAll('.conversation').forEach((el) => el.remove());

    if (conversations.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'new-msg-empty';
      empty.style.padding = '16px';
      empty.textContent = 'No conversations yet — click "+ New" to message someone.';
      listEl.appendChild(empty);
      return;
    }

    conversations.forEach((conv) => {
      const item = document.createElement('div');
      item.className = 'conversation' + (conv.id === activeId ? ' active' : '') + (conv.unread ? ' unread' : '');

      const avatar = document.createElement('div');
      avatar.className = 'conv-avatar';
      avatar.textContent = conv.initials;

      const meta = document.createElement('div');
      meta.className = 'conv-meta';

      const nameRow = document.createElement('div');
      nameRow.className = 'conv-name-row';
      const nameEl = document.createElement('div');
      nameEl.className = 'conv-name';
      nameEl.textContent = conv.name;
      const timeEl = document.createElement('div');
      timeEl.className = 'conv-time';
      timeEl.textContent = conv.lastTime;
      nameRow.appendChild(nameEl);
      nameRow.appendChild(timeEl);

      const previewRow = document.createElement('div');
      previewRow.style.display = 'flex';
      previewRow.style.alignItems = 'center';
      const preview = document.createElement('div');
      preview.className = 'conv-preview';
      preview.textContent = conv.lastText;
      previewRow.appendChild(preview);
      if (conv.unread) {
        const dot = document.createElement('div');
        dot.className = 'unread-dot';
        previewRow.appendChild(dot);
      }

      meta.appendChild(nameRow);
      meta.appendChild(previewRow);

      item.appendChild(avatar);
      item.appendChild(meta);
      item.addEventListener('click', () => openConversation(conv.id));

      listEl.appendChild(item);
    });
  }

  function appendBubble(messagesEl, msg) {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (msg.sender_id === currentUser.id ? 'sent' : 'received');
    const bubbleWrap = document.createElement('div');
    bubbleWrap.className = 'bubble-wrap';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.text;

    const time = document.createElement('div');
    time.className = 'bubble-time';
    time.textContent = formatTime(msg.created_at);

    bubbleWrap.appendChild(bubble);
    bubbleWrap.appendChild(time);
    row.appendChild(bubbleWrap);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function renderThread() {
    const threadEl = document.getElementById('thread');
    threadEl.innerHTML = '';

    const conv = conversations.find((c) => c.id === activeId);
    if (!conv) {
      const empty = document.createElement('div');
      empty.className = 'thread-empty';
      empty.textContent = 'Select a conversation to start chatting.';
      threadEl.appendChild(empty);
      return;
    }

    const header = document.createElement('div');
    header.className = 'thread-header';

    const back = document.createElement('button');
    back.className = 'thread-back';
    back.setAttribute('aria-label', 'Back to messages');
    back.textContent = '←';
    back.addEventListener('click', closeThread);

    const nameEl = document.createElement('div');
    nameEl.className = 'thread-name';
    nameEl.textContent = conv.name;

    header.appendChild(back);
    header.appendChild(nameEl);

    const messagesEl = document.createElement('div');
    messagesEl.className = 'thread-messages';
    messagesEl.id = 'threadMessages';

    const inputBar = document.createElement('div');
    inputBar.className = 'thread-input';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Write a message...';
    input.id = 'messageInput';
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    const sendBtn = document.createElement('button');
    sendBtn.className = 'thread-send';
    sendBtn.textContent = 'Send';
    sendBtn.addEventListener('click', sendMessage);

    inputBar.appendChild(input);
    inputBar.appendChild(sendBtn);

    threadEl.appendChild(header);
    threadEl.appendChild(messagesEl);
    threadEl.appendChild(inputBar);

    const { data: messages } = await sb
      .from('messages')
      .select('id, sender_id, text, created_at')
      .eq('conversation_id', activeId)
      .order('created_at', { ascending: true });

    (messages || []).forEach((m) => appendBubble(messagesEl, m));
    messagesEl.scrollTop = messagesEl.scrollHeight;

    if (activeChannel) sb.removeChannel(activeChannel);
    activeChannel = sb
      .channel('messages:' + activeId)
      .on(
        'postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'messages', filter: 'conversation_id=eq.' + activeId },
        (payload) => {
          const el = document.getElementById('threadMessages');
          if (el) appendBubble(el, payload.new);
        }
      )
      .subscribe();
  }

  async function openConversation(id) {
    activeId = id;
    const conv = conversations.find((c) => c.id === id);
    if (conv) conv.unread = false;

    await sb
      .from('conversation_participants')
      .update({ last_read_at: new Date().toISOString() })
      .eq('conversation_id', id)
      .eq('user_id', currentUser.id);

    renderList();
    await renderThread();
    document.getElementById('messenger').classList.add('thread-open');
  }

  function closeThread() {
    document.getElementById('messenger').classList.remove('thread-open');
    if (activeChannel) {
      sb.removeChannel(activeChannel);
      activeChannel = null;
    }
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    if (!input) return;
    const text = input.value.trim();
    if (!text || !activeId) return;

    input.value = '';
    const { error } = await sb
      .from('messages')
      .insert({ conversation_id: activeId, sender_id: currentUser.id, text });

    if (error) {
      alert('Could not send message: ' + error.message);
      return;
    }

    await loadConversations();
    renderList();
    document.getElementById('messageInput').focus();
  }

  // ----- New Message search -----
  const newMsgBtn = document.getElementById('newMsgBtn');
  const newMsgPanel = document.getElementById('newMsgPanel');
  const newMsgSearch = document.getElementById('newMsgSearch');
  const newMsgResults = document.getElementById('newMsgResults');
  let searchTimer = null;

  newMsgBtn.addEventListener('click', () => {
    newMsgPanel.classList.toggle('open');
    if (newMsgPanel.classList.contains('open')) newMsgSearch.focus();
  });

  newMsgSearch.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = newMsgSearch.value.trim();
    searchTimer = setTimeout(() => runSearch(q), 250);
  });

  async function runSearch(query) {
    newMsgResults.innerHTML = '';
    if (!query) return;

    const { data: results } = await sb
      .from('profiles')
      .select('id, display_name, initials')
      .ilike('display_name', '%' + query + '%')
      .neq('id', currentUser.id)
      .limit(10);

    if (!results || results.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'new-msg-empty';
      empty.textContent = 'No one found by that name.';
      newMsgResults.appendChild(empty);
      return;
    }

    results.forEach((person) => {
      const row = document.createElement('div');
      row.className = 'new-msg-result';

      const avatar = document.createElement('div');
      avatar.className = 'conv-avatar';
      avatar.style.width = '32px';
      avatar.style.height = '32px';
      avatar.style.fontSize = '11px';
      avatar.textContent = person.initials;

      const name = document.createElement('div');
      name.textContent = person.display_name;

      row.appendChild(avatar);
      row.appendChild(name);
      row.addEventListener('click', () => startConversation(person));

      newMsgResults.appendChild(row);
    });
  }

  async function startConversation(person) {
    // Look for an existing conversation shared with this person.
    const { data: mine } = await sb
      .from('conversation_participants')
      .select('conversation_id')
      .eq('user_id', currentUser.id);
    const myIds = (mine || []).map((m) => m.conversation_id);

    let conversationId = null;
    if (myIds.length > 0) {
      const { data: shared } = await sb
        .from('conversation_participants')
        .select('conversation_id')
        .eq('user_id', person.id)
        .in('conversation_id', myIds);
      if (shared && shared.length > 0) conversationId = shared[0].conversation_id;
    }

    if (!conversationId) {
      // Generate the id client-side and skip .select() on the insert:
      // right after creating the conversation, the creator isn't a
      // participant of it yet (that's the next statement), so the
      // conversations SELECT policy would deny reading the row back,
      // which Postgres/PostgREST reports as an insert RLS violation.
      conversationId = crypto.randomUUID();

      const { error: convErr } = await sb
        .from('conversations')
        .insert({ id: conversationId, created_by: currentUser.id });

      if (convErr) {
        alert('Could not start conversation: ' + convErr.message);
        return;
      }

      const { error: partErr } = await sb.from('conversation_participants').insert([
        { conversation_id: conversationId, user_id: currentUser.id },
        { conversation_id: conversationId, user_id: person.id },
      ]);

      if (partErr) {
        alert('Could not add participants: ' + partErr.message);
        return;
      }
    }

    newMsgPanel.classList.remove('open');
    newMsgSearch.value = '';
    newMsgResults.innerHTML = '';

    await loadConversations();
    await openConversation(conversationId);
  }

  (async function init() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return; // auth-guard.js already redirects; nothing more to do
    currentUser = user;
    await loadConversations();
    renderList();
    renderThread();
  })();
</script>
</body>
</html>
