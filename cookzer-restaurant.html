      width: 36px; height: 36px; border-radius: 50%;

      flex: 1;
      margin-top: 60px;

    }

  .restaurant-content { max-width: 760px; margin: 0 auto; padding: 24px 24px 60px; }

      text-decoration: none; margin-bottom: 16px;

  /* Hero photo strip */
  .hero-strip {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      height: 260px;

      margin-bottom: 18px;

  .hero-strip.single { grid-template-columns: 1fr; grid-template-rows: 1fr; height: 200px; }
  .hero-strip > div {

      background-size: cover;
      background-position: center;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      position: relative;
    }
  .hero-strip > div:first-child:not(:only-child) { grid-row: 1 / 3; font-size: 46px; }
  .hero-more {
      position: absolute; inset: 0;
      background: rgba(20,18,14,0.45);
      color: #fff; font-weight: 700; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }

  .title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
  .restaurant-title { font-size: 27px; font-family: 'Fraunces', serif; font-weight: 600; color: var(--ink); }
  .maps-link {
      flex-shrink: 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--olive-dark);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 7px 13px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
  .maps-link:hover { background: var(--cream); }
  .address-line { font-size: 13px; color: var(--ink-soft); margin: 6px 0 20px; }

  /* Stat tiles */
  .stat-row { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .stat-tile {
      flex: 1;
      min-width: 130px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }
  .stat-tile.hot { background: rgba(255, 107, 74, 0.08); border-color: rgba(255, 107, 74, 0.28); }
  .stat-num { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: var(--olive-dark); font-variant-numeric: tabular-nums; }
  .stat-tile.hot .stat-num { color: var(--brick); }
  .stat-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

  .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 20px;
      border-radius: 16px;
      border: none;
      background: var(--olive);
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      margin-bottom: 22px;
    }
  .cta-btn:hover { background: var(--olive-dark); }

  /* Inline rate panel (reuses the .rate-panel pattern from cookzer-restaurants.html) */
  .rate-panel {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 26px;
    }
  .rate-panel.hidden { display: none; }
  .rate-panel label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 14px 0 6px;
    }
  .rate-panel label:first-child { margin-top: 0; }
  .rate-panel textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      color: var(--ink);
      font-family: inherit;

  .star-picker .star {

      cursor: pointer;
      color: var(--line);

  .star-picker .star.filled { color: var(--mustard, #F4B942); }
  .receipt-input-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .rate-panel label.receipt-upload-btn {

      border: 1px dashed var(--line);
      border-radius: 12px;

  .tab {

<script>
  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.querySelector('.sidebar-overlay').classList.toggle('open');
  }

  const restaurantId = new URLSearchParams(location.search).get('id');
  let currentUser = null;
  let selectedRatingValue = 0;
  let pendingReceiptFile = null;
  let pendingClaimProofFile = null;
  let isPlatformAdmin = false;

  function publicUrl(bucket, path) {
    if (!path) return null;
    if (path.indexOf('http://') === 0 || path.indexOf('https://') === 0) return path;
    return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
  }

  function starString(avg) {
    const rounded = Math.round(avg);
    return '★★★★★'.slice(0, rounded) + '☆☆☆☆☆'.slice(0, 5 - rounded);
  }

  // A rating from 2 years ago at a restaurant that's since changed
  // chefs shouldn't count the same as one from last month — halves a
  // rating's weight roughly every 18 months rather than dropping it,
  // so the aggregate stays responsive without discarding history.
  function recencyWeight(iso) {
    const ageDays = (Date.now() - new Date(iso).getTime()) / 86400000;
    return Math.pow(0.5, ageDays / 540);
  }

  function weightedAverage(ratings) {
    let sumWeight = 0;
    let sumWeightedRating = 0;
    ratings.forEach((r) => {
      const w = recencyWeight(r.created_at);
      sumWeight += w;
      sumWeightedRating += w * r.rating;
    });
    return sumWeight > 0 ? sumWeightedRating / sumWeight : 0;
  }

  // Which dish each rating was for is the one comparison angle a plain
  // restaurant-level star rating (Google's, or a naive average of ours)
  // can't offer — rolled up into "best dish here" from whoever bothered
  // to say what they ordered.
  function computeDishRollup(ratings) {
    const byDish = {};
    ratings.forEach((r) => {
      const name = (r.dish_name || '').trim();
      if (!name) return;
      const key = name.toLowerCase();
      if (!byDish[key]) byDish[key] = { name, total: 0, count: 0 };
      byDish[key].total += r.rating;
      byDish[key].count += 1;
    });
    return Object.values(byDish)
      .map((d) => ({ name: d.name, avg: d.total / d.count, count: d.count }))
      .sort((a, b) => b.avg - a.avg || b.count - a.count)
      .slice(0, 5);
  }

  // Friends who've either left a receipt-verified rating here or tagged
  // a Dining Out post here — the social proof Google Maps and Yelp
  // structurally can't show, since neither has a real friend graph.
  function computeFriendsHere(friendIds, posts, ratings) {
    const friendSet = new Set(friendIds);
    const byUser = {};
    ratings.forEach((r) => {
      if (friendSet.has(r.user_id)) byUser[r.user_id] = { userId: r.user_id, profiles: r.profiles, rating: r.rating };
    });
    posts.forEach((p) => {
      if (friendSet.has(p.author_id) && !byUser[p.author_id]) {
        byUser[p.author_id] = { userId: p.author_id, profiles: p.profiles, rating: null };
      }
    });
    return Object.values(byUser);
  }

  function credibilityTier(score) {
    if (score >= 30) return '🍽️⭐ Top Foodie';
    if (score >= 15) return '🍽️ Trusted Foodie';
    if (score >= 5) return 'Regular';
    return null;
  }

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min' + (mins === 1 ? '' : 's') + ' ago';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' hour' + (hours === 1 ? '' : 's') + ' ago';
    const days = Math.floor(hours / 24);
    return days + ' day' + (days === 1 ? '' : 's') + ' ago';
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s || '';
    return div.innerHTML;
  }

  // A claimed business supplies its own website/menu URL — rendered as a
  // real link, so reject anything that isn't actually a web address
  // (e.g. javascript:) rather than trusting it outright.
  function safeUrl(u) {
    if (!u) return null;
    return /^https?:\/\//i.test(u) ? u : null;
  }

          '<div class="stat-sub">' + (ratingsCount ? 'Cookzer · ' + ratingsCount + (ratingsCount === 1 ? ' receipt-verified' : ' receipt-verified') : 'No ratings yet') + '</div>' +

  function renderCommunityTab(posts) {
    const panel = document.getElementById('tab-community');
    if (posts.length === 0) {
      panel.innerHTML = '<div class="empty-note">No one has tagged this place yet. Be the first to post from here!</div>';
      return;
    }

    const gridHtml = '<div class="community-grid">' +
      posts.map((p) => {
        const authorName = (p.profiles && p.profiles.display_name) || 'Someone';
        const photoStyle = p.photo_path ? " style=\"background-image:url('" + publicUrl('post-photos', p.photo_path) + "')\"" : '';
        return '<a class="community-card" href="cookzer-feed.html?post=' + p.id + '">' +
          '<div class="community-photo"' + photoStyle + '>' + (p.photo_path ? '' : '🍽️') + '</div>' +
          '<div class="community-meta">' +
            '<div class="community-author">' + escapeHtml(authorName) + '</div>' +
            '<div class="community-caption">' + escapeHtml(p.caption || '') + '</div>' +
          '</div>' +
        '</a>';
      }).join('') +
    '</div>';

    const seen = {};
    const taggers = [];
    posts.forEach((p) => {
      if (!seen[p.author_id]) {
        seen[p.author_id] = true;
        taggers.push(p.profiles || { display_name: 'Someone', initials: '?' });
      }
    });
    const shown = taggers.slice(0, 6);
    const moreCount = taggers.length - shown.length;
    const taggersHtml = '<div class="taggers-section">' +
      '<div class="section-label">Recently tagged by</div>' +
      '<div class="taggers-row">' +
        shown.map((t) => '<div class="tagger-avatar">' + escapeHtml(t.initials || '?') + '</div>').join('') +
        (moreCount > 0 ? '<span class="taggers-more">+' + moreCount + ' other' + (moreCount === 1 ? '' : 's') + '</span>' : '') +
      '</div>' +
    '</div>';

    panel.innerHTML = gridHtml + taggersHtml;
  }

  function renderReviewsTab(ratings, credibilityMap) {
    const panel = document.getElementById('tab-reviews');
    if (ratings.length === 0) {
      panel.innerHTML = '<div class="empty-note">No receipt-verified ratings yet.</div>';
      return;
    }
    panel.innerHTML = '';
    ratings.forEach((r) => {
      const row = document.createElement('div');
      row.className = 'review-row';

      const avatar = document.createElement('div');
      avatar.className = 'review-avatar';
      avatar.textContent = (r.profiles && r.profiles.initials) || '?';

      const bodyEl = document.createElement('div');
      bodyEl.className = 'review-body';

      const top = document.createElement('div');
      top.className = 'review-top';
      const nameLink = document.createElement('a');
      nameLink.className = 'review-name';
      nameLink.href = 'cookzer-profile.html?id=' + r.user_id;
      nameLink.textContent = (r.profiles && r.profiles.display_name) || 'Someone';
      const stars = document.createElement('span');
      stars.className = 'review-stars';
      stars.textContent = starString(r.rating);
      const badge = document.createElement('span');
      badge.className = 'verified-badge';
      badge.textContent = '✓ Receipt verified';
      top.appendChild(nameLink);
      top.appendChild(stars);
      top.appendChild(badge);
      const tier = credibilityMap && credibilityTier(credibilityMap[r.user_id]);
      if (tier) {
        const credBadge = document.createElement('span');
        credBadge.className = 'credibility-badge';
        credBadge.textContent = tier;
        top.appendChild(credBadge);
      }
      bodyEl.appendChild(top);

      if (r.dish_name) {
        const dish = document.createElement('div');
        dish.className = 'review-text';
        dish.style.fontStyle = 'italic';
        dish.textContent = 'Ordered: ' + r.dish_name;
        bodyEl.appendChild(dish);
      }

      if (r.review) {
        const text = document.createElement('div');
        text.className = 'review-text';
        text.textContent = r.review;
        bodyEl.appendChild(text);
      }

      const date = document.createElement('div');
      date.className = 'review-date';
      date.textContent = timeAgo(r.created_at);
      bodyEl.appendChild(date);

      if (r.receipt_photo_path) {
        const receiptUrl = publicUrl('restaurant-receipts', r.receipt_photo_path);
        const proof = document.createElement('div');
        proof.className = 'review-receipt';
        proof.innerHTML = '<img src="' + receiptUrl + '" alt="Receipt"> 🧾 Proof attached';
        proof.addEventListener('click', () => CookzerLightbox.open({
          imageUrl: receiptUrl,
          authorName: (r.profiles && r.profiles.display_name) || 'Someone',
          authorInitials: (r.profiles && r.profiles.initials) || '??',
          authorHref: 'cookzer-profile.html?id=' + r.user_id,
          timestamp: r.created_at,
          caption: r.review || '',
          meta: [{ label: 'Rating', value: starString(r.rating) }],
        }));
        bodyEl.appendChild(proof);
      }

      row.appendChild(avatar);
      row.appendChild(bodyEl);
      panel.appendChild(row);
    });
  }

  function updateStarDisplay() {
    document.querySelectorAll('#starPicker .star').forEach((s) => {
      s.classList.toggle('filled', Number(s.dataset.value) <= selectedRatingValue);
    });
  }

  async function uploadReceipt(file) {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = currentUser.id + '/' + crypto.randomUUID() + '.' + ext;
    const { error } = await sb.storage.from('restaurant-receipts').upload(path, file);
    if (error) {
      await CookzerModal.alert('Receipt upload failed: ' + error.message);
      return null;
    }
    return path;
  }

  function wireRatePanel(restaurant) {
    const ratePanel = document.getElementById('ratePanel');
    selectedRatingValue = 0;
    pendingReceiptFile = null;

    document.getElementById('rateBtn').addEventListener('click', () => {
      ratePanel.classList.remove('hidden');
      document.getElementById('rateBtn').style.display = 'none';
    });

    document.getElementById('cancelRateBtn').addEventListener('click', () => {
      ratePanel.classList.add('hidden');
      document.getElementById('rateBtn').style.display = '';
      document.getElementById('dishInput').value = '';
      document.getElementById('reviewInput').value = '';
      document.getElementById('receiptInput').value = '';
      document.getElementById('receiptPreview').hidden = true;
      selectedRatingValue = 0;
      pendingReceiptFile = null;
      updateStarDisplay();
    });

    document.querySelectorAll('#starPicker .star').forEach((s) => {
      s.addEventListener('click', () => {
        selectedRatingValue = Number(s.dataset.value);
        updateStarDisplay();
      });
    });

    document.getElementById('receiptInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      pendingReceiptFile = file;
      const preview = document.getElementById('receiptPreview');
      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
    });

    document.getElementById('submitRatingBtn').addEventListener('click', async () => {
      if (!selectedRatingValue) { await CookzerModal.alert('Pick a star rating first.'); return; }
      if (!pendingReceiptFile) { await CookzerModal.alert('Attach a receipt or invoice photo — ratings need proof.'); return; }

      const btn = document.getElementById('submitRatingBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const receiptPath = await uploadReceipt(pendingReceiptFile);
      if (!receiptPath) {
        btn.disabled = false; btn.textContent = 'Submit rating';
        return;
      }

      const review = document.getElementById('reviewInput').value.trim();
      const dishName = document.getElementById('dishInput').value.trim();
      const { error: ratingErr } = await sb
        .from('restaurant_ratings')
        .upsert({
          restaurant_id: restaurant.id,
          user_id: currentUser.id,
          rating: selectedRatingValue,
          review: review || null,
          dish_name: dishName || null,
          receipt_photo_path: receiptPath,
        }, { onConflict: 'restaurant_id,user_id' });

      btn.disabled = false;
      btn.textContent = 'Submit rating';

      if (ratingErr) {
        await CookzerModal.alert('Could not save rating: ' + ratingErr.message);
        return;
      }

      await loadAndRender();
    });
  }

  async function uploadClaimProof(file) {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = currentUser.id + '/' + crypto.randomUUID() + '.' + ext;
    const { error } = await sb.storage.from('restaurant-claim-proofs').upload(path, file);
    if (error) {
      await CookzerModal.alert('Proof upload failed: ' + error.message);
      return null;
    }
    return path;
  }

  function wireClaimFlow(restaurant) {
    pendingClaimProofFile = null;
    const claimBtn = document.getElementById('claimBtn');
    const claimPanel = document.getElementById('claimPanel');

    if (claimBtn) {
      claimBtn.addEventListener('click', () => {
        claimPanel.classList.remove('hidden');
        claimBtn.style.display = 'none';
      });

      document.getElementById('cancelClaimBtn').addEventListener('click', () => {
        claimPanel.classList.add('hidden');
        claimBtn.style.display = '';
        document.getElementById('claimEmailInput').value = '';
        document.getElementById('claimPhoneInput').value = '';
        document.getElementById('claimProofInput').value = '';
        document.getElementById('claimProofPreview').hidden = true;
        pendingClaimProofFile = null;
      });

      document.getElementById('claimProofInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        pendingClaimProofFile = file;
        const preview = document.getElementById('claimProofPreview');
        preview.src = URL.createObjectURL(file);
        preview.hidden = false;
      });

      document.getElementById('submitClaimBtn').addEventListener('click', async () => {
        const email = document.getElementById('claimEmailInput').value.trim();
        if (!email) { await CookzerModal.alert('A business email is required so we can follow up on your claim.'); return; }
        if (!pendingClaimProofFile) { await CookzerModal.alert('Attach a proof photo — a business license, utility bill, or similar.'); return; }

        const btn = document.getElementById('submitClaimBtn');
        btn.disabled = true;
        btn.textContent = 'Submitting...';

        const proofPath = await uploadClaimProof(pendingClaimProofFile);
        if (!proofPath) {
          btn.disabled = false; btn.textContent = 'Submit claim';
          return;
        }

        const phone = document.getElementById('claimPhoneInput').value.trim();
        const { error: claimErr } = await sb
          .from('restaurant_claim_requests')
          .insert({
            restaurant_id: restaurant.id,
            user_id: currentUser.id,
            business_email: email,
            business_phone: phone || null,
            proof_photo_path: proofPath,
          });

        btn.disabled = false;
        btn.textContent = 'Submit claim';

        if (claimErr) {
          await CookzerModal.alert('Could not submit claim: ' + claimErr.message);
          return;
        }

        await CookzerModal.alert('Claim submitted — we\'ll review it and follow up at ' + email + '.');
        await loadAndRender();
      });
    }

    const editBtn = document.getElementById('editBusinessBtn');
    if (editBtn) {
      const editPanel = document.getElementById('editBusinessPanel');
      editBtn.addEventListener('click', () => editPanel.classList.remove('hidden'));
      document.getElementById('cancelEditBusinessBtn').addEventListener('click', () => editPanel.classList.add('hidden'));

      document.getElementById('saveBusinessBtn').addEventListener('click', async () => {
        const btn = document.getElementById('saveBusinessBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const { error } = await sb.rpc('update_restaurant_claimed_details', {
          p_restaurant_id: restaurant.id,
          p_phone: document.getElementById('bizPhoneInput').value.trim() || null,
          p_website: document.getElementById('bizWebsiteInput').value.trim() || null,
          p_menu_url: document.getElementById('bizMenuInput').value.trim() || null,
        });

        btn.disabled = false;
        btn.textContent = 'Save';

        if (error) {
          await CookzerModal.alert('Could not save business details: ' + error.message);
          return;
        }

        await loadAndRender();
      });
    }
  }

  function wireAdminTools(restaurant) {
    const verifiedCheck = document.getElementById('adminVerifiedCheck');
    if (verifiedCheck) {
      verifiedCheck.addEventListener('change', async () => {
        const checked = verifiedCheck.checked;
        verifiedCheck.disabled = true;
        const { error } = await sb.rpc('set_restaurant_verified', { p_restaurant_id: restaurant.id, p_verified: checked });
        if (error) {
          await CookzerModal.alert('Could not update verified status: ' + error.message);
          verifiedCheck.checked = !checked;
          verifiedCheck.disabled = false;
          return;
        }
        await loadAndRender();
      });
    }

    const featureBtn = document.getElementById('adminFeatureBtn');
    if (featureBtn) {
      featureBtn.addEventListener('click', async () => {
        featureBtn.disabled = true;
        const { error } = await sb.rpc('set_restaurant_featured', { p_restaurant_id: restaurant.id, p_days: 30 });
        featureBtn.disabled = false;
        if (error) { await CookzerModal.alert('Could not feature this restaurant: ' + error.message); return; }
        await loadAndRender();
      });
    }

    const unfeatureBtn = document.getElementById('adminUnfeatureBtn');
    if (unfeatureBtn) {
      unfeatureBtn.addEventListener('click', async () => {
        unfeatureBtn.disabled = true;
        const { error } = await sb.rpc('set_restaurant_featured', { p_restaurant_id: restaurant.id, p_days: null });
        unfeatureBtn.disabled = false;
        if (error) { await CookzerModal.alert('Could not remove featured placement: ' + error.message); return; }
        await loadAndRender();
      });
    }
  }

  async function loadAndRender() {
    const { data: restaurant, error } = await sb
      .from('restaurants')
      .select('id, name, address, lat, lng, google_place_id, google_rating, tag_count, claimed_by, claim_status, phone, website, menu_url, is_verified, featured_until')
      .eq('id', restaurantId)
      .single();

    if (error || !restaurant) {
      document.getElementById('pageBody').innerHTML = '<div class="not-found-note">This restaurant couldn\'t be found. It may have been removed.</div>';
      return;
    }

    document.title = restaurant.name + ' — Cookzer';

    const [{ data: posts }, { data: ratings }, { data: follows }, { data: credibility }] = await Promise.all([
      sb.from('posts')
        .select('id, author_id, caption, photo_path, created_at, profiles!posts_author_id_fkey(display_name, initials, avatar_url)')
        .eq('restaurant_id', restaurantId)
        .order('created_at', { ascending: false }),
      sb.from('restaurant_ratings')
        .select('id, user_id, rating, review, dish_name, receipt_photo_path, created_at, profiles(display_name, initials)')
        .eq('restaurant_id', restaurantId)
        .order('created_at', { ascending: false }),
      sb.from('follows')
        .select('followee_id')
        .eq('follower_id', currentUser.id),
      sb.from('reviewer_credibility')
        .select('user_id, foodie_score'),
    ]);

    const credibilityMap = {};
    (credibility || []).forEach((c) => { credibilityMap[c.user_id] = c.foodie_score; });

    const friendIds = (follows || []).map((f) => f.followee_id);
    const friendsHere = computeFriendsHere(friendIds, posts || [], ratings || []);

    let myClaim = null;
    if (restaurant.claim_status === 'pending') {
      const { data: claims } = await sb
        .from('restaurant_claim_requests')
        .select('id, status')
        .eq('restaurant_id', restaurantId)
        .eq('user_id', currentUser.id)
        .eq('status', 'pending')
        .maybeSingle();
      myClaim = claims;
    }

    renderPage(restaurant, posts || [], ratings || [], credibilityMap, friendsHere, myClaim);
  }

  (async function init() {
    if (!restaurantId) {
      document.getElementById('pageBody').innerHTML = '<div class="not-found-note">No restaurant specified.</div>';
      return;
    }
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;
    currentUser = user;
    const { data: profile } = await sb.from('profiles').select('is_platform_admin').eq('id', user.id).single();
    isPlatformAdmin = !!(profile && profile.is_platform_admin);
    await loadAndRender();
  })();
</script>
