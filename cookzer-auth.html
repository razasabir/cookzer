<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#009246">
  <title>Sign in — Cookzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
  html, body {
      font-family: 'Work Sans', sans-serif;
      color: var(--ink);
      background: var(--cream);
      min-height: 100vh;
      min-height: 100dvh;
    }

  body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

  .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
    }

  .brand {
      text-align: center;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 28px;
      color: var(--olive-dark);
      margin-bottom: 6px;
    }

  .brand span { color: var(--brick); }

  .tagline {
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 28px;
    }

  .tabs {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
    }

  .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      background: var(--cream);
    }

  .tab.active {
      background: var(--olive);
      color: #fff;
    }

  form { display: none; flex-direction: column; gap: 14px; }

  form.active { display: flex; }

  label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }

  input {
      width: 100%;
      padding: 10px 14px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 14px;
      color: var(--ink);
      font-family: inherit;
    }

  .submit-btn {
      background: var(--olive);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
    }

  .submit-btn:hover { background: var(--olive-dark); }

  .submit-btn:disabled { opacity: 0.6; cursor: default; }

  .message {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 14px;
      display: none;
    }

  .message.error {
      display: block;
      background: rgba(169, 78, 46, 0.1);
      color: var(--brick);
    }

  .message.success {
      display: block;
      background: rgba(78, 90, 62, 0.1);
      color: var(--olive-dark);
    }

  .oauth-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

  .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

  .oauth-btn:hover { background: var(--cream); }
  .oauth-btn:disabled { opacity: 0.6; cursor: default; }
  .oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .oauth-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--ink-soft);
      font-size: 12px;
    }

  .oauth-divider::before, .oauth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div style="display:flex; justify-content:flex-end; margin-bottom:-8px;">
      <button class="icon-btn theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark mode" type="button" style="width:32px;height:32px;font-size:15px;">🌙</button>
    </div>
    <div class="brand">Cook<span>zer</span></div>
    <div class="tagline">A social network for people who cook.</div>

    <div class="oauth-buttons">
      <button type="button" class="oauth-btn" id="googleAuthBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.8 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 34.9 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.9 39.8 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C40.6 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <button type="button" class="oauth-btn" id="facebookAuthBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Continue with Facebook
      </button>
    </div>
    <div class="oauth-divider">or</div>

    <div class="tabs">
      <div class="tab active" data-tab="signin">Sign In</div>
      <div class="tab" data-tab="signup">Sign Up</div>
    </div>

    <div class="message" id="message"></div>

    <form id="signinForm" class="active">
      <div>
        <label>Email</label>
        <input type="email" id="signinEmail" required autocomplete="email">
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="signinPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <form id="signupForm">
      <div>
        <label>Display Name</label>
        <input type="text" id="signupName" required autocomplete="name" placeholder="e.g. Sarah K.">
      </div>
      <div>
        <label>Email</label>
        <input type="email" id="signupEmail" required autocomplete="email">
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="signupPassword" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <div style="text-align:center; margin-top:16px;">
      <a href="cookzer-privacy.html" style="font-size:12px; color:var(--ink-soft);">Privacy Policy</a>
    </div>
  </div>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const forms = { signin: document.getElementById('signinForm'), signup: document.getElementById('signupForm') };
    const messageEl = document.getElementById('message');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }

    function clearMessage() {
      messageEl.className = 'message';
      messageEl.textContent = '';
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        Object.values(forms).forEach((f) => f.classList.remove('active'));
        forms[tab.dataset.tab].classList.add('active');
        clearMessage();
      });
    });

    // Support ?tab=signup deep links (e.g. from the landing page CTA).
    const requestedTab = new URLSearchParams(location.search).get('tab');
    if (requestedTab === 'signup') {
      document.querySelector('[data-tab="signup"]').click();
    }

    // If already signed in, skip straight to the app.
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'cookzer-feed.html';
    })();

    // Google and Facebook both block OAuth sign-in when it happens inside
    // an app's own embedded WebView (their anti-phishing policy) — it only
    // works in a real browser tab. Inside the Android/iOS app, this is
    // detected via window.Capacitor and the flow instead opens in the
    // system browser (@capacitor/browser), then bounces back into the app
    // via a custom-scheme deep link (com.cookzer.app://auth-callback,
    // registered in AndroidManifest.xml / Info.plist) caught below by
    // @capacitor/app's appUrlOpen listener.
    function isNativeApp() {
      return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    }

    const OAUTH_CALLBACK_URL = 'com.cookzer.app://auth-callback';

    async function handleOAuthCallback(url) {
      const code = new URL(url).searchParams.get('code');
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
        window.Capacitor.Plugins.Browser.close().catch(() => {});
      }
      if (!code) return;
      const { error } = await sb.auth.exchangeCodeForSession(code);
      if (error) {
        showMessage(error.message, 'error');
        return;
      }
      window.location.href = 'cookzer-feed.html';
    }

    if (isNativeApp() && window.Capacitor.Plugins.App) {
      window.Capacitor.Plugins.App.addListener('appUrlOpen', (event) => {
        if (event.url && event.url.indexOf(OAUTH_CALLBACK_URL) === 0) {
          handleOAuthCallback(event.url);
        }
      });
    }

    function oauthSignIn(provider, btn) {
      return async () => {
        clearMessage();
        btn.disabled = true;

        if (isNativeApp()) {
          const { data, error } = await sb.auth.signInWithOAuth({
            provider,
            options: { redirectTo: OAUTH_CALLBACK_URL, skipBrowserRedirect: true },
          });
          if (error) {
            showMessage(error.message, 'error');
            btn.disabled = false;
            return;
          }
          await window.Capacitor.Plugins.Browser.open({ url: data.url });
          btn.disabled = false;
          return;
        }

        const { error } = await sb.auth.signInWithOAuth({
          provider,
          options: { redirectTo: window.location.origin + '/cookzer-feed.html' },
        });
        // On success the browser navigates away to the provider immediately —
        // this only returns if something's wrong before that redirect happens.
        if (error) {
          showMessage(error.message, 'error');
          btn.disabled = false;
        }
      };
    }
    document.getElementById('googleAuthBtn').addEventListener('click', oauthSignIn('google', document.getElementById('googleAuthBtn')));
    document.getElementById('facebookAuthBtn').addEventListener('click', oauthSignIn('facebook', document.getElementById('facebookAuthBtn')));

    forms.signin.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();
      const email = document.getElementById('signinEmail').value.trim();
      const password = document.getElementById('signinPassword').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        showMessage(error.message, 'error');
        return;
      }
      window.location.href = 'cookzer-feed.html';
    });

    forms.signup.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();
      const displayName = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { data: { display_name: displayName } },
      });

      if (error) {
        showMessage(error.message, 'error');
        return;
      }

      if (data.session) {
        window.location.href = 'cookzer-feed.html';
        return;
      }

      showMessage('Account created — check your email to confirm it, then sign in.', 'success');
    });
  </script>

</body>
</html>
