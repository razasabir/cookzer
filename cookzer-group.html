<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#2E8F5C">
  <title>Group — Cookzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="notifications-shared.js"></script>
  <script src="firebase-config.js"></script>
  <script src="push-notifications.js"></script>
  <script src="auth-guard.js"></script>
  <script src="friends-widget.js"></script>
  <script src="cookzer-modal.js"></script>
  <script src="photo-filters.js"></script>
  <script src="photo-cropper.js"></script>
  <script src="theme.js"></script>
  <script src="photo-lightbox.js"></script>
  <script src="shortcuts.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
  .brand-header {
      font-size: 20px;
      color: var(--olive-dark);
      letter-spacing: -0.5px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
    }

  .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--olive), var(--olive-dark));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 600; cursor: pointer;
    }

  .main {
      flex: 1;
      margin-top: 60px;
      overflow-y: auto;
    }

  .group-content {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

  .group-header {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 24px;
    }

  .group-cover {
      height: 100px;
    }

  .group-header-body {
      padding: 20px;
    }

  .group-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

  .group-name {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 24px;
      color: var(--ink);
    }

  .group-member-count {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 4px;
    }

  .group-desc {
      font-size: 14px;
      color: var(--ink);
      margin-top: 12px;
      line-height: 1.5;
    }

  .group-rules {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 8px;
      line-height: 1.5;
      background: var(--plus-tint);
      border-radius: 10px;
      padding: 10px 14px;
      white-space: pre-wrap;
    }

  .join-btn {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--olive);
      color: #fff;
      flex-shrink: 0;
    }

  .join-btn.joined {
      background: var(--cream);
      color: var(--ink-soft);
      border: 1px solid var(--line);
    }

  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .admin-btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--cream);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

  .admin-btn.danger { color: var(--brick); }

  .members-section {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }

  .members-section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--ink-soft);
      margin-bottom: 10px;
    }

  .member-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--line);
    }

  .member-row:first-child { border-top: none; }

  .member-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--olive), var(--olive-dark));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 600; font-size: 12px;
    }

  .member-name { flex: 1; font-size: 13.5px; color: var(--ink); text-decoration: none; }
  .member-name:hover { color: var(--olive-dark); }
  .member-owner-tag { font-size: 11px; color: var(--ink-soft); }

  .member-admin-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--olive-dark);
      background: var(--plus-tint);
      border: 1px solid var(--plus-border);
      border-radius: 10px;
      padding: 2px 8px;
    }

  .member-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .member-role-btn {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
    }

  .member-remove-btn {
      background: none;
      border: none;
      color: var(--brick);
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

  .add-members-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .add-members-row input[type="text"] {
      width: 100%;
      padding: 9px 14px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--ink);
    }
  .add-members-results { margin-top: 8px; }

  /* Composer (simplified: caption + photo) */
    .composer {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 24px;
      width: 100%;
    }

  .composer-header {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

  .composer-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--olive), var(--olive-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
    }

  .composer-input { flex: 1; }

  .composer-input input {
      width: 100%;
      padding: 10px 14px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 20px;
      font-size: 13px;
      color: var(--ink);
      font-family: inherit;
    }

  .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

  .composer-btn {
      padding: 8px 14px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--ink-soft);
    }

  .composer-btn:hover { background: #f0e6d2; color: var(--olive); }

  .post-btn {
      background: var(--olive);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

  /* Feed cards (mirrors cookzer-feed.html) */
    .feed-card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      margin-bottom: 20px;
      overflow: hidden;
      width: 100%;
    }

  .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

  .pinned-badge {
      background: var(--plus-tint);
      color: var(--olive-dark);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 16px;
      border-bottom: 1px solid var(--plus-border);
    }

  .card-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--olive), var(--olive-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
    }

  .card-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .card-time { font-size: 12px; color: var(--ink-soft); }

  .card-author-link {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      text-decoration: none;
      color: inherit;
    }

  .card-delete-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--ink-faint);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
    }

  .card-delete-btn:hover {
      background: var(--cream);
      color: var(--brick);
    }

  .card-image {
      width: 100%;
      height: 280px;
      background-size: cover;
      background-position: center;
    }

  .card-content { padding: 16px; }
  .card-description { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 12px; }

  .card-stats {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--ink-soft);
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

  .card-actions { display: flex; gap: 8px; }

  .action-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--ink-soft);
    }

  .action-btn:hover { background: var(--cream); }

  .empty-note { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 24px; }

  @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        height: 100vh;
        height: 100dvh;
        z-index: 100;
        transition: left 0.25s ease;
      }
      .sidebar.open { left: 0; }
      .sidebar-overlay.open { display: block; }
      .menu-toggle { display: flex; }
      .header { left: 0; padding: 0 16px; gap: 12px; }
      .search-bar { display: none; }
      .main { margin-left: 0; }
      .brand-header { font-size: 18px; }
    }

  @media (max-width: 480px) {
      .header { padding: 0 12px; }
      .icon-btn, .avatar { width: 32px; height: 32px; font-size: 15px; }
    }
  @media (max-width: 400px) {
      .header { gap: 8px; }
      .header-right { gap: 6px; }
      .menu-toggle { width: 30px; height: 30px; }
      .icon-btn, .avatar { width: 28px; height: 28px; font-size: 13px; }
      .brand-header { font-size: 16px; }
    }
  </style>
</head>

<div class="main">
  <div class="group-content">
    <div class="group-header">

          <button type="button" id="copyInviteCodeBtn" style="background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; color:var(--ink);">Copy</button>

    <div class="members-section">
      <div class="members-section-title">Members</div>
      <div id="membersList"></div>
      <div class="add-members-row" id="addMembersRow" hidden>
        <input type="text" id="addMembersInput" placeholder="Search people to add by name...">
        <div class="add-members-results" id="addMembersResults"></div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-header">

  <div class="cz2-modal" id="pickerModal"></div>
</div>

<script>
  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.querySelector('.sidebar-overlay').classList.toggle('open');
  }

  const params = new URLSearchParams(location.search);
  const groupId = params.get('id');
  let currentUser = null;
  let isMember = false;
  let pendingPhotoFilter = 'original';
  let pendingVignette = false;
  let pendingFilterUserPicked = false;
  let pendingPhotoFile = null;
  let canManageGroup = false;

  function publicUrl(bucket, path) {
    if (!path) return null;
    if (path.indexOf('http://') === 0 || path.indexOf('https://') === 0) return path; // external URL (e.g. a licensed stock photo) — use as-is
    return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
  }

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min' + (mins === 1 ? '' : 's') + ' ago';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' hour' + (hours === 1 ? '' : 's') + ' ago';
    const days = Math.floor(hours / 24);
    return days + ' day' + (days === 1 ? '' : 's') + ' ago';
  }

  let isCreator = false;

  function closePicker() {
    document.getElementById('pickerOverlay').hidden = true;
    document.getElementById('pickerModal').innerHTML = '';
  }

  document.getElementById('pickerOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'pickerOverlay') closePicker();
  });

  function cz2Button(label, primary) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'admin-btn';
    if (primary) btn.style.cssText = 'background:var(--olive); color:#fff; border-color:var(--olive);';
    btn.textContent = label;
    return btn;
  }

  const COVER_PRESETS = [
    'linear-gradient(135deg, var(--olive), var(--olive-dark))',
    'linear-gradient(135deg, #6B8CBE, #3E5C8A)',
    'linear-gradient(135deg, #D97AA0, #A94E6E)',
    'linear-gradient(135deg, #8A6BBE, #5C3E8A)',
    'linear-gradient(135deg, #4CA5A0, #2E706C)',
  ];

  function coverBackground(group) {
    if (group.cover_photo_path) return 'url(\'' + publicUrl('post-photos', group.cover_photo_path) + '\') center/cover';
    return group.cover_gradient || COVER_PRESETS[0];
  }

  function openEditGroupModal(group) {
    const modal = document.getElementById('pickerModal');
    modal.innerHTML = '';

    const title = document.createElement('h3');
    title.textContent = 'Edit group';
    modal.appendChild(title);

    const coverPreview = document.createElement('div');
    coverPreview.className = 'cz2-cover-preview';
    coverPreview.style.background = coverBackground(group);
    modal.appendChild(coverPreview);

    let pendingCoverFile = null;
    let selectedGradient = group.cover_gradient || COVER_PRESETS[0];

    const photoInput = document.createElement('input');
    photoInput.type = 'file';
    photoInput.accept = 'image/*';
    photoInput.hidden = true;
    const photoBtn = cz2Button('📸 Change photo', false);
    photoBtn.style.marginBottom = '14px';
    photoBtn.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      pendingCoverFile = file;
      coverPreview.style.background = 'url(\'' + URL.createObjectURL(file) + '\') center/cover';
    });
    modal.appendChild(photoBtn);
    modal.appendChild(photoInput);

    const label = document.createElement('div');
    label.className = 'cz2-label';
    label.textContent = 'Or pick a color';
    modal.appendChild(label);

    const swatchRow = document.createElement('div');
    swatchRow.style.cssText = 'display:flex; gap:10px; margin-bottom:14px;';
    COVER_PRESETS.forEach((gradient) => {
      const swatch = document.createElement('div');
      const isSelected = !pendingCoverFile && gradient === selectedGradient;
      swatch.style.cssText = 'width:32px; height:32px; border-radius:50%; cursor:pointer; background:' + gradient + '; border:2px solid ' + (isSelected ? 'var(--ink)' : 'transparent') + ';';
      swatch.addEventListener('click', () => {
        selectedGradient = gradient;
        pendingCoverFile = null;
        coverPreview.style.background = gradient;
        Array.from(swatchRow.children).forEach((s) => { s.style.borderColor = 'transparent'; });
        swatch.style.borderColor = 'var(--ink)';
      });
      swatchRow.appendChild(swatch);
    });
    modal.appendChild(swatchRow);

    const nameLabel = document.createElement('div');
    nameLabel.className = 'cz2-label';
    nameLabel.textContent = 'Group name';
    modal.appendChild(nameLabel);
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = group.name;
    modal.appendChild(nameInput);

    const descLabel = document.createElement('div');
    descLabel.className = 'cz2-label';
    descLabel.textContent = 'Description';
    modal.appendChild(descLabel);
    const descField = document.createElement('div');
    descField.className = 'cz2-field';
    const descInput = document.createElement('textarea');
    descInput.rows = 3;
    descInput.value = group.description || '';
    descField.appendChild(descInput);
    modal.appendChild(descField);

    const rulesLabel = document.createElement('div');
    rulesLabel.className = 'cz2-label';
    rulesLabel.textContent = 'Group rules (optional)';
    modal.appendChild(rulesLabel);
    const rulesField = document.createElement('div');
    rulesField.className = 'cz2-field';
    const rulesInput = document.createElement('textarea');
    rulesInput.rows = 3;
    rulesInput.placeholder = 'e.g. Be kind, no spam, keep it food-related...';
    rulesInput.value = group.rules || '';
    rulesField.appendChild(rulesInput);
    modal.appendChild(rulesField);

    const actions = document.createElement('div');
    actions.className = 'cz2-actions';
    const cancelBtn = cz2Button('Cancel', false);
    cancelBtn.addEventListener('click', closePicker);
    const saveBtn = cz2Button('Save', true);
    saveBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name) return;
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';

      const updates = { name, description: descInput.value.trim() || null, rules: rulesInput.value.trim() || null };
      if (pendingCoverFile) {
        const ext = (pendingCoverFile.name.split('.').pop() || 'jpg').toLowerCase();
        const path = 'group-covers/' + groupId + '-' + Date.now() + '.' + ext;
        const { error: uploadErr } = await sb.storage.from('post-photos').upload(path, pendingCoverFile, { contentType: pendingCoverFile.type });
        if (uploadErr) {
          await CookzerModal.alert('Photo upload failed: ' + uploadErr.message);
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save';
          return;
        }
        updates.cover_photo_path = path;
        updates.cover_gradient = null;
      } else if (selectedGradient !== group.cover_gradient || group.cover_photo_path) {
        updates.cover_gradient = selectedGradient;
        updates.cover_photo_path = null;
      }

      const { error } = await sb.from('groups').update(updates).eq('id', groupId);
      if (error) {
        await CookzerModal.alert('Could not save: ' + error.message);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
        return;
      }
      closePicker();
      await loadGroup();
    });
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    modal.appendChild(actions);

    document.getElementById('pickerOverlay').hidden = false;
    nameInput.focus();
  }

  function openTransferOwnershipModal(group, members) {

    modal.innerHTML = '';

    const title = document.createElement('h3');
    title.textContent = 'Transfer ownership';

    label.className = 'cz2-label';
    label.textContent = 'Pick a member to hand this group over to. You\'ll keep your membership as a regular member.';
    modal.appendChild(label);

    const others = members.filter((m) => m.user_id !== group.created_by && m.profiles);

    const list = document.createElement('div');
    list.className = 'cz2-list';

    if (others.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'cz2-empty';
      empty.textContent = 'No other members to transfer to yet.';
      list.appendChild(empty);
    }

    others.forEach((m) => {
      const row = document.createElement('div');
      row.className = 'cz2-row';
      const av = document.createElement('div');
      av.className = 'cz2-row-avatar';
      av.textContent = m.profiles.initials || '??';
      const nm = document.createElement('span');
      nm.textContent = m.profiles.display_name || 'Someone';
      const chooseBtn = document.createElement('button');
      chooseBtn.type = 'button';
      chooseBtn.className = 'cz2-row-action';
      chooseBtn.textContent = 'Make owner';
      chooseBtn.addEventListener('click', async () => {
        if (!(await CookzerModal.confirm('Make ' + (m.profiles.display_name || 'this member') + ' the new owner of "' + group.name + '"? You\'ll become a regular member.', { confirmLabel: 'Transfer', danger: true }))) return;
        const { error } = await sb.from('groups').update({ created_by: m.user_id }).eq('id', groupId);
        if (error) { await CookzerModal.alert('Could not transfer: ' + error.message); return; }

        await loadGroup();

      row.appendChild(nm);
      row.appendChild(chooseBtn);

    cancelBtn.addEventListener('click', closePicker);
    actions.appendChild(cancelBtn);
    modal.appendChild(actions);

    document.getElementById('pickerOverlay').hidden = false;
  }

  async function loadGroup() {
    const { data: group } = await sb
      .from('groups')
      .select('id, name, description, cover_gradient, cover_photo_path, created_by, is_private, invite_code, rules')
      .eq('id', groupId)
      .single();

    if (!group) {
      document.getElementById('groupName').textContent = 'Group not found';
      return;
    }

    document.title = group.name + ' — Cookzer';
    document.getElementById('groupCover').style.background = coverBackground(group);
    document.getElementById('groupName').textContent = group.name;
    document.getElementById('groupDesc').textContent = group.description || '';
    document.getElementById('groupDesc').hidden = !group.description;
    document.getElementById('groupRules').textContent = group.rules ? 'Group rules: ' + group.rules : '';
    document.getElementById('groupRules').hidden = !group.rules;

    isCreator = group.created_by === currentUser.id;
    document.getElementById('deleteGroupBtn').hidden = !isCreator;

    document.getElementById('editGroupBtn').onclick = () => openEditGroupModal(group);

    document.getElementById('deleteGroupBtn').onclick = async () => {
      if (!(await CookzerModal.confirm('Delete "' + group.name + '"? This removes all its posts and can\'t be undone.', { confirmLabel: 'Delete', danger: true }))) return;
      const { error } = await sb.from('groups').delete().eq('id', groupId);
      if (error) { await CookzerModal.alert('Could not delete: ' + error.message); return; }
      window.location.href = 'cookzer-groups.html';
    };

    const { data: members } = await sb
      .from('group_members')
      .select('user_id, role, muted, profiles(display_name, initials)')
      .eq('group_id', groupId)
      .order('joined_at', { ascending: true });

    document.getElementById('groupMemberCount').textContent = (members ? members.length : 0) + ((members && members.length === 1) ? ' member' : ' members');

    const myRow = (members || []).find((m) => m.user_id === currentUser.id);
    isMember = !!myRow;
    const canManageMembers = isCreator || (myRow && myRow.role === 'admin');
    canManageGroup = canManageMembers;
    const existingMemberIds = new Set((members || []).map((m) => m.user_id));

    document.getElementById('editGroupBtn').hidden = !canManageMembers;

    document.getElementById('groupEventsBtn').hidden = !isMember;
    document.getElementById('groupPollsBtn').hidden = !isMember;
    document.getElementById('groupEventsLink').href = 'cookzer-group-events.html?id=' + groupId;
    document.getElementById('groupPollsLink').href = 'cookzer-group-polls.html?id=' + groupId;

    const muteBtn = document.getElementById('muteGroupBtn');
    muteBtn.hidden = !isMember;
    if (isMember) {
      muteBtn.textContent = myRow.muted ? '🔕 Muted' : '🔔';
      muteBtn.title = myRow.muted ? 'Unmute this group' : 'Mute this group';
      muteBtn.onclick = async () => {
        const { error } = await sb.from('group_members').update({ muted: !myRow.muted }).eq('group_id', groupId).eq('user_id', currentUser.id);
        if (error) { await CookzerModal.alert('Could not update: ' + error.message); return; }
        await loadGroup();
      };
    }

    const transferBtn = document.getElementById('transferGroupBtn');
    transferBtn.hidden = !isCreator;
    if (isCreator) {
      transferBtn.onclick = () => openTransferOwnershipModal(group, members || []);
    }

    const membersListEl = document.getElementById('membersList');
    membersListEl.innerHTML = '';
    (members || []).filter((m) => m.profiles).forEach((m) => {
      const row = document.createElement('div');
      row.className = 'member-row';

      const avatar = document.createElement('div');
      avatar.className = 'member-avatar';
      avatar.textContent = m.profiles.initials || '??';

      const name = document.createElement('a');
      name.className = 'member-name';
      name.href = 'cookzer-profile.html?id=' + m.user_id;
      name.textContent = m.profiles.display_name || 'Someone';

      row.appendChild(avatar);
      row.appendChild(name);

      const actions = document.createElement('div');
      actions.className = 'member-actions';

      if (m.user_id === group.created_by) {
        const tag = document.createElement('span');
        tag.className = 'member-owner-tag';
        tag.textContent = 'Owner';
        actions.appendChild(tag);
      } else {
        if (m.role === 'admin') {
          const tag = document.createElement('span');
          tag.className = 'member-admin-tag';
          tag.textContent = 'Admin';
          actions.appendChild(tag);
        }
        if (isCreator) {
          const roleBtn = document.createElement('button');
          roleBtn.type = 'button';
          roleBtn.className = 'member-role-btn';
          roleBtn.textContent = m.role === 'admin' ? 'Remove admin' : 'Make admin';
          roleBtn.addEventListener('click', async () => {
            const { error } = await sb.from('group_members').update({ role: m.role === 'admin' ? 'member' : 'admin' }).eq('group_id', groupId).eq('user_id', m.user_id);
            if (error) await CookzerModal.alert('Could not update role: ' + error.message);
            else await loadGroup();
          });
          actions.appendChild(roleBtn);
        }
        if (canManageMembers) {
          const removeBtn = document.createElement('button');
          removeBtn.className = 'member-remove-btn';
          removeBtn.type = 'button';
          removeBtn.textContent = 'Remove';
          removeBtn.addEventListener('click', async () => {
            if (!(await CookzerModal.confirm('Remove ' + (m.profiles.display_name || 'this member') + ' from the group?', { confirmLabel: 'Remove', danger: true }))) return;
            const { error } = await sb.from('group_members').delete().eq('group_id', groupId).eq('user_id', m.user_id);
            if (error) { await CookzerModal.alert('Could not remove: ' + error.message); return; }
            await loadGroup();
          });
          actions.appendChild(removeBtn);
        }
      }

      row.appendChild(actions);
      membersListEl.appendChild(row);
    });

    const addMembersRow = document.getElementById('addMembersRow');
    addMembersRow.hidden = !canManageMembers;
    if (canManageMembers) {
      const addInput = document.getElementById('addMembersInput');
      const addResults = document.getElementById('addMembersResults');
      let addDebounce = null;
      addInput.oninput = (e) => {
        const query = e.target.value.trim();
        clearTimeout(addDebounce);
        if (!query) { addResults.innerHTML = ''; return; }
        addDebounce = setTimeout(async () => {
          const { data: matches } = await sb
            .from('profiles')
            .select('id, display_name, initials')
            .ilike('display_name', '%' + query + '%')
            .limit(8);
          addResults.innerHTML = '';
          (matches || []).filter((p) => !existingMemberIds.has(p.id)).forEach((p) => {
            const row = document.createElement('div');
            row.className = 'cz2-row';
            const av = document.createElement('div');
            av.className = 'cz2-row-avatar';
            av.textContent = p.initials || '??';
            const nm = document.createElement('span');
            nm.textContent = p.display_name || 'Someone';
            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'cz2-row-action';
            addBtn.textContent = 'Add';
            addBtn.addEventListener('click', async () => {
              const { error } = await sb.from('group_members').insert({ group_id: groupId, user_id: p.id });
              if (error) { await CookzerModal.alert('Could not add: ' + error.message); return; }
              addInput.value = '';
              addResults.innerHTML = '';
              await loadGroup();
            });
            row.appendChild(av);
            row.appendChild(nm);
            row.appendChild(addBtn);
            addResults.appendChild(row);
          });
        }, 300);
      };
    }

    const inviteRow = document.getElementById('inviteCodeRow');
    inviteRow.hidden = !(group.is_private && isMember && group.invite_code);
    if (!inviteRow.hidden) {
      document.getElementById('inviteCodeText').textContent = group.invite_code;
      document.getElementById('copyInviteCodeBtn').onclick = async () => {
        try {
          await navigator.clipboard.writeText(group.invite_code);
          document.getElementById('copyInviteCodeBtn').textContent = 'Copied!';
          setTimeout(() => { document.getElementById('copyInviteCodeBtn').textContent = 'Copy'; }, 1500);
        } catch (e) {
          await CookzerModal.prompt('Copy this invite code:', group.invite_code);
        }
      };
    }

    const joinBtn = document.getElementById('joinGroupBtn');
    joinBtn.textContent = isMember ? 'Joined ✓' : 'Join';
    joinBtn.className = 'join-btn' + (isMember ? ' joined' : '');
    joinBtn.onclick = async () => {
      if (isMember) {
        await sb.from('group_members').delete().eq('group_id', groupId).eq('user_id', currentUser.id);
      } else {
        await sb.from('group_members').insert({ group_id: groupId, user_id: currentUser.id });
      }
      await loadGroup();
    };
  }

  document.getElementById('composerPhotoBtn').addEventListener('click', () => {
    document.getElementById('composerPhotoInput').click();
  });

  function renderComposerFilterRow() {
    const preview = document.getElementById('composerPhotoPreview');
    const filterRow = document.getElementById('composerFilterRow');
    CookzerPhotoFilters.renderSwatches(filterRow, preview.src, pendingPhotoFilter, (f) => {
      pendingPhotoFilter = f.key;
      pendingFilterUserPicked = true; // stop an in-flight suggestion from later overriding this
      preview.style.filter = f.css;
      document.getElementById('composerFilterSuggestion').hidden = true; // the user made their own choice — stop suggesting
      renderComposerFilterRow();
    }, pendingVignette, (v) => {
      pendingVignette = v;
      preview.style.boxShadow = v ? CookzerPhotoFilters.VIGNETTE_PREVIEW_CSS : 'none';
      renderComposerFilterRow();
    });
  }

  document.getElementById('composerPhotoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = ''; // let picking the exact same file again re-fire change
    const cropped = await CookzerPhotoCropper.open(file, { aspect: 4 / 3, title: 'Crop your photo' });
    if (!cropped) return;
    applyComposerPhoto(cropped);
  });

  function applyComposerPhoto(file) {
    pendingPhotoFile = file;
    pendingPhotoFilter = 'original';
    pendingVignette = false;
    pendingFilterUserPicked = false;
    const preview = document.getElementById('composerPhotoPreview');
    const url = URL.createObjectURL(file);
    preview.src = url;
    preview.style.filter = 'none';
    preview.style.boxShadow = 'none';
    preview.hidden = false;
    document.getElementById('composerFilterSuggestion').hidden = true;

    document.getElementById('composerFilterRow').hidden = false;
    renderComposerFilterRow();

    // Suggest a starting filter based on the photo itself — a default +
    // a hint only; every swatch, including Original, is still one click
    // away. Guarded against a newer photo, or the user's own pick,
    // landing first.
    CookzerPhotoFilters.loadImage(url).then((img) => {
      if (pendingPhotoFile !== file || pendingFilterUserPicked) return;
      const suggestion = CookzerPhotoFilters.suggestFilter(img);
      CookzerPhotoFilters.renderSuggestion(document.getElementById('composerFilterSuggestion'), suggestion);
      if (suggestion) {
        pendingPhotoFilter = suggestion.key;
        preview.style.filter = CookzerPhotoFilters.FILTER_CSS[suggestion.key];
        renderComposerFilterRow();
      }
    }).catch(() => {});
  }

  async function uploadPostPhoto(file, filterKey, vignette) {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = currentUser.id + '/' + crypto.randomUUID() + '.' + ext;
    let toUpload = file;
    if ((filterKey && filterKey !== 'original') || vignette) {
      try {
        const img = await CookzerPhotoFilters.loadImage(URL.createObjectURL(file));
        toUpload = await CookzerPhotoFilters.bakeFilter(img, CookzerPhotoFilters.FILTER_CSS[filterKey], file.type, vignette);
      } catch (e) {
        toUpload = file; // filter failed — post the unfiltered photo rather than blocking
      }
    }
    const { error } = await sb.storage.from('post-photos').upload(path, toUpload, { contentType: file.type });
    if (error) {
      await CookzerModal.alert('Photo upload failed: ' + error.message);
      return null;
    }
    return path;
  }

  document.getElementById('composerPostBtn').addEventListener('click', async () => {
    const captionInput = document.getElementById('postCaption');
    const caption = captionInput.value.trim();
    if (!caption && !pendingPhotoFile) return;

    let photoPath = null;
    if (pendingPhotoFile) photoPath = await uploadPostPhoto(pendingPhotoFile, pendingPhotoFilter, pendingVignette);

    const { error } = await sb
      .from('posts')
      .insert({ author_id: currentUser.id, kind: 'post', caption: caption || null, photo_path: photoPath, group_id: groupId });

    if (error) {
      await CookzerModal.alert('Could not post: ' + error.message);
      return;
    }

    captionInput.value = '';
    pendingPhotoFile = null;
    pendingPhotoFilter = 'original';
    pendingVignette = false;
    pendingFilterUserPicked = false;
    document.getElementById('composerPhotoPreview').hidden = true;
    document.getElementById('composerPhotoPreview').style.filter = 'none';
    document.getElementById('composerPhotoPreview').style.boxShadow = 'none';
    document.getElementById('composerFilterRow').hidden = true;
    document.getElementById('composerFilterSuggestion').hidden = true;
    await loadGroupFeed();
  });

  function cardShell(post) {
    const card = document.createElement('div');
    card.className = 'feed-card';

    const header = document.createElement('div');
    header.className = 'card-header';
    const avatar = document.createElement('div');
    avatar.className = 'card-avatar';
    avatar.textContent = post.profiles ? post.profiles.initials : '??';
    const meta = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = post.profiles ? post.profiles.display_name : 'Someone';
    const time = document.createElement('div');
    time.className = 'card-time';
    time.textContent = timeAgo(post.created_at);
    meta.appendChild(name);
    meta.appendChild(time);
    const authorLink = document.createElement('a');
    authorLink.className = 'card-author-link';
    authorLink.href = 'cookzer-profile.html?id=' + post.author_id;
    authorLink.appendChild(avatar);
    authorLink.appendChild(meta);
    header.appendChild(authorLink);

    if (canManageGroup) {
      const pinBtn = document.createElement('button');
      pinBtn.className = 'card-delete-btn';
      pinBtn.title = post.pinned_at ? 'Unpin' : 'Pin to top';
      pinBtn.type = 'button';
      pinBtn.textContent = post.pinned_at ? '📌' : '📍';
      pinBtn.addEventListener('click', () => togglePin(post));
      header.appendChild(pinBtn);
    }

    if (currentUser && post.author_id === currentUser.id) {
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'card-delete-btn';
      deleteBtn.title = 'Delete post';
      deleteBtn.type = 'button';
      deleteBtn.textContent = '🗑';
      deleteBtn.addEventListener('click', () => deletePost(post.id, card));
      header.appendChild(deleteBtn);
    } else if (currentUser) {
      const reportBtn = document.createElement('button');
      reportBtn.className = 'card-delete-btn';
      reportBtn.title = 'Report post';
      reportBtn.type = 'button';
      reportBtn.textContent = '🚩';
      reportBtn.addEventListener('click', () => reportPost(post.id));
      header.appendChild(reportBtn);
    }

    card.appendChild(header);

    if (post.pinned_at) {
      const pinnedBadge = document.createElement('div');
      pinnedBadge.className = 'pinned-badge';
      pinnedBadge.textContent = '📌 Pinned';
      card.insertBefore(pinnedBadge, header);
    }

    if (post.photo_path) {
      const imageUrl = publicUrl('post-photos', post.photo_path);
      const img = document.createElement('div');
      img.className = 'card-image';
      img.style.backgroundImage = "url('" + imageUrl + "')";
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', () => CookzerLightbox.open({
        imageUrl,
        authorName: post.profiles ? post.profiles.display_name : 'Someone',
        authorInitials: post.profiles ? post.profiles.initials : '??',
        authorHref: 'cookzer-profile.html?id=' + post.author_id,
        timestamp: post.created_at,
        caption: post.caption || '',
      }));
      card.appendChild(img);
    }

    const content = document.createElement('div');
    content.className = 'card-content';

    if (post.caption) {
      const desc = document.createElement('div');
      desc.className = 'card-description';
      desc.textContent = post.caption;
      content.appendChild(desc);
    }

    const stats = document.createElement('div');
    stats.className = 'card-stats';
    const heartStat = document.createElement('div');
    heartStat.id = 'heartCount-' + post.id;
    heartStat.textContent = '❤️ 0 hearts';
    const commentStat = document.createElement('div');
    commentStat.id = 'commentCount-' + post.id;
    commentStat.textContent = '💬 0 comments';
    stats.appendChild(heartStat);
    stats.appendChild(commentStat);
    content.appendChild(stats);

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const heartBtn = document.createElement('button');
    heartBtn.className = 'action-btn';
    heartBtn.id = 'heartBtn-' + post.id;
    heartBtn.textContent = '❤️ Heart';
    heartBtn.addEventListener('click', () => toggleHeart(post.id));
    const commentBtn = document.createElement('button');
    commentBtn.className = 'action-btn';
    commentBtn.textContent = '💬 Comment';
    commentBtn.addEventListener('click', () => toggleCommentBox(post.id));
    actions.appendChild(heartBtn);
    actions.appendChild(commentBtn);
    content.appendChild(actions);

    const commentBox = document.createElement('div');
    commentBox.id = 'commentBox-' + post.id;
    commentBox.hidden = true;
    commentBox.style.marginTop = '10px';
    content.appendChild(commentBox);

    card.appendChild(content);
    return card;
  }

  async function reportPost(postId) {
    const reason = await CookzerModal.prompt('Why are you reporting this post? (spam, harassment, inappropriate content, other)');
    if (!reason) return;
    const { error } = await sb.from('reports').insert({ reporter_id: currentUser.id, target_type: 'post', target_id: postId, reason });
    if (error) await CookzerModal.alert('Could not send report: ' + error.message);
    else await CookzerModal.alert('Thanks — this post has been reported for review.');
  }

  async function deletePost(postId, cardEl) {
    if (!(await CookzerModal.confirm('Delete this post? This can\'t be undone.', { confirmLabel: 'Delete', danger: true }))) return;

    const { error } = await sb.from('posts').delete().eq('id', postId);
    if (error) {
      await CookzerModal.alert('Could not delete post: ' + error.message);
      return;
    }

    cardEl.remove();
    document.getElementById('groupFeedEmpty').hidden = !!document.getElementById('groupFeed').children.length;
  }

  async function togglePin(post) {
    const { error } = await sb.from('posts').update({ pinned_at: post.pinned_at ? null : new Date().toISOString() }).eq('id', post.id);
    if (error) { await CookzerModal.alert('Could not update pin: ' + error.message); return; }
    await loadGroupFeed();
  }

  async function refreshPostStats(postId) {
    const { count: heartCount } = await sb.from('hearts').select('*', { count: 'exact', head: true }).eq('post_id', postId);
    const { count: commentCount } = await sb.from('comments').select('*', { count: 'exact', head: true }).eq('post_id', postId);
    const { data: mine } = await sb.from('hearts').select('post_id').eq('post_id', postId).eq('user_id', currentUser.id).maybeSingle();

    const heartEl = document.getElementById('heartCount-' + postId);
    const commentEl = document.getElementById('commentCount-' + postId);
    const heartBtn = document.getElementById('heartBtn-' + postId);
    if (heartEl) heartEl.textContent = '❤️ ' + (heartCount || 0) + ' hearts';
    if (commentEl) commentEl.textContent = '💬 ' + (commentCount || 0) + ' comments';
    if (heartBtn) {
      heartBtn.textContent = mine ? '❤️ Hearted' : '❤️ Heart';
      heartBtn.style.color = mine ? 'var(--brick)' : '';
    }
  }

  async function toggleHeart(postId) {
    const { data: mine } = await sb.from('hearts').select('post_id').eq('post_id', postId).eq('user_id', currentUser.id).maybeSingle();
    if (mine) {
      await sb.from('hearts').delete().eq('post_id', postId).eq('user_id', currentUser.id);
    } else {
      await sb.from('hearts').insert({ post_id: postId, user_id: currentUser.id });
    }
    await refreshPostStats(postId);
  }

  async function toggleCommentBox(postId) {
    const box = document.getElementById('commentBox-' + postId);
    if (!box.hidden) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    await renderComments(postId, box);
  }

  async function renderComments(postId, box) {
    box.innerHTML = '';
    const { data: comments } = await sb
      .from('comments')
      .select('id, author_id, text, created_at, profiles(display_name, initials)')
      .eq('post_id', postId)
      .order('created_at', { ascending: true });

    (comments || []).forEach((c) => {
      const row = document.createElement('div');
      row.style.fontSize = '13px';
      row.style.marginBottom = '6px';
      const nameLink = document.createElement('a');
      nameLink.href = 'cookzer-profile.html?id=' + c.author_id;
      nameLink.style.color = 'inherit';
      nameLink.style.fontWeight = '700';
      nameLink.style.textDecoration = 'none';
      nameLink.textContent = (c.profiles ? c.profiles.display_name : 'Someone') + ': ';
      row.appendChild(nameLink);
      row.appendChild(document.createTextNode(c.text));
      box.appendChild(row);
    });

    const inputRow = document.createElement('div');
    inputRow.style.display = 'flex';
    inputRow.style.gap = '8px';
    inputRow.style.marginTop = '8px';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Write a comment...';
    input.style.flex = '1';
    input.style.padding = '8px 12px';
    input.style.border = '1px solid var(--line)';
    input.style.borderRadius = '14px';
    input.style.fontSize = '12px';
    input.style.background = 'var(--cream)';
    input.style.color = 'var(--ink)';
    input.addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter' || !input.value.trim()) return;
      const { error } = await sb.from('comments').insert({ post_id: postId, author_id: currentUser.id, text: input.value.trim() });
      if (!error) {
        input.value = '';
        await renderComments(postId, box);
        await refreshPostStats(postId);
      }
    });
    inputRow.appendChild(input);
    box.appendChild(inputRow);
  }

  async function loadGroupFeed() {
    const [{ data: rawPosts }, blockedIds] = await Promise.all([
      sb
        .from('posts')
        .select('id, author_id, caption, photo_path, created_at, pinned_at, profiles!posts_author_id_fkey(display_name, initials)')
        .eq('group_id', groupId)
        .order('created_at', { ascending: false })
        .limit(50),
      window.blockedIdsReady || Promise.resolve(new Set()),
    ]);
    const posts = (rawPosts || []).filter((p) => !blockedIds.has(p.author_id));
    // Pinned posts float to the top (newest-pinned first), everything
    // else stays in the created_at order the query already fetched.
    const pinned = posts.filter((p) => p.pinned_at).sort((a, b) => new Date(b.pinned_at) - new Date(a.pinned_at));
    const unpinned = posts.filter((p) => !p.pinned_at);
    const ordered = pinned.concat(unpinned);

    const listEl = document.getElementById('groupFeed');
    listEl.innerHTML = '';
    document.getElementById('groupFeedEmpty').hidden = !!(posts && posts.length);

    ordered.forEach((post) => {
      listEl.appendChild(cardShell(post));
    });
    await refreshAllPostStats(posts.map((p) => p.id));
  }

  // Batched replacement for refreshPostStats() per post — see the same
  // fix on the main feed for why (N posts meant 3N queries).
  async function refreshAllPostStats(postIds) {
    if (postIds.length === 0) return;

    const [{ data: hearts }, { data: comments }] = await Promise.all([
      sb.from('hearts').select('post_id, user_id').in('post_id', postIds),
      sb.from('comments').select('post_id').in('post_id', postIds),
    ]);

    const heartCounts = {};
    const myHearts = new Set();
    (hearts || []).forEach((h) => {
      heartCounts[h.post_id] = (heartCounts[h.post_id] || 0) + 1;
      if (currentUser && h.user_id === currentUser.id) myHearts.add(h.post_id);
    });
    const commentCounts = {};
    (comments || []).forEach((c) => {
      commentCounts[c.post_id] = (commentCounts[c.post_id] || 0) + 1;
    });

    postIds.forEach((postId) => {
      const heartEl = document.getElementById('heartCount-' + postId);
      const commentEl = document.getElementById('commentCount-' + postId);
      const heartBtn = document.getElementById('heartBtn-' + postId);
      if (heartEl) heartEl.textContent = '❤️ ' + (heartCounts[postId] || 0) + ' hearts';
      if (commentEl) commentEl.textContent = '💬 ' + (commentCounts[postId] || 0) + ' comments';
      if (heartBtn) {
        const mine = myHearts.has(postId);
        heartBtn.textContent = mine ? '❤️ Hearted' : '❤️ Heart';
        heartBtn.style.color = mine ? 'var(--brick)' : '';
      }
    });
  }

  (async function init() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;
    currentUser = user;
    if (!groupId) {
      document.getElementById('groupName').textContent = 'No group specified';
      return;
    }
    await loadGroup();
    await loadGroupFeed();
  })();
</script>
