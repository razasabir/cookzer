<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Discover — Cookzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth-guard.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
  .brand-header {
      font-size: 20px;
      color: var(--olive-dark);
      letter-spacing: -0.5px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
    }

  .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--mustard), var(--brick));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 600; cursor: pointer;
    }

  /* Main content */
    .main {
      flex: 1;
      margin-left: 280px;
      margin-top: 60px;
      overflow-y: auto;
    }

  .discover-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

  .page-title {
      font-size: 28px;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      color: var(--olive-dark);
      margin-bottom: 24px;
      text-align: center;
      width: 100%;
    }

  /* Challenge hero */
    .challenge-hero {
      width: 100%;
      max-width: 700px;
      background: linear-gradient(135deg, var(--olive), var(--olive-dark));
      color: #fff;
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 32px;
    }

  .challenge-badge {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 12px;
      opacity: 0.9;
    }

  .challenge-title {
      font-size: 32px;
      font-family: 'Fraunces', serif;
      margin-bottom: 12px;
      font-weight: 600;
    }

  .challenge-details {
      font-size: 14px;
      margin-bottom: 20px;
      opacity: 0.95;
    }

  .challenge-btn {
      background: #fff;
      color: var(--olive);
      padding: 12px 32px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

  .challenge-btn:hover {
      background: var(--cream);
      transform: translateY(-2px);
    }

  /* Filters */
    .filters-section {
      width: 100%;
      max-width: 700px;
      margin-bottom: 32px;
    }

  .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

  .filter-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

  .filter-chip {
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      transition: all 0.2s;
    }

  .filter-chip:hover {
      border-color: var(--olive);
      background: rgba(78, 90, 62, 0.05);
    }

  .filter-chip.active {
      background: var(--mustard);
      color: #fff;
      border-color: var(--mustard);
    }

  /* Leaderboard */
    .leaderboard-section {
      width: 100%;
      max-width: 700px;
    }

  .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

  .leaderboard-item {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

  .leaderboard-item:hover {
      border-color: var(--mustard);
    }

  .rank-badge {
      font-size: 24px;
      min-width: 40px;
      text-align: center;
    }

  .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mustard), var(--brick));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      flex-shrink: 0;
    }

  .entry-content {
      flex: 1;
    }

  .entry-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 2px;
    }

  .entry-recipe {
      font-size: 12px;
      color: var(--ink-soft);
    }

  .entry-hearts {
      font-size: 14px;
      font-weight: 600;
      color: var(--brick);
      text-align: right;
    }

  /* Responsive */
    @media (max-width: 900px) {
      .right-sidebar { display: none; }
    }

  @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        height: 100vh;
        z-index: 100;
        transition: left 0.25s ease;
      }
      .sidebar.open { left: 0; }
      .sidebar-overlay.open { display: block; }
      .menu-toggle { display: flex; }
      .header { left: 0; padding: 0 16px; gap: 12px; }
      .search-bar { display: none; }
      .main { margin-left: 0; }
      .brand-header { font-size: 18px; }
    }

  @media (max-width: 480px) {
      .header { padding: 0 12px; }
      .icon-btn, .avatar { width: 32px; height: 32px; font-size: 15px; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-brand">Cook<span>zer</span></div>
  
  <a href="index.html" style="text-decoration: none;"><div class="sidebar-item icon feed">Feed</div></a>
  <a href="cookzer-cookbook.html" style="text-decoration: none;"><div class="sidebar-item icon cookbook">My Cookbook</div></a>
  <a href="cookzer-planner.html" style="text-decoration: none;"><div class="sidebar-item icon planner">Meal Planner</div></a>
  <a href="cookzer-challenges.html" style="text-decoration: none;"><div class="sidebar-item icon challenges active">Challenges</div></a>
  <a href="cookzer-profile.html" style="text-decoration: none;"><div class="sidebar-item icon profile">Profile</div></a>
  <a href="cookzer-messenger.html" style="text-decoration: none;"><div class="sidebar-item icon messenger">Messenger</div></a>
</div>

<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Header -->
<div class="header">
  <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
  <div class="brand-header">Cook<span>zer</span></div>
  <div class="header-right">
    <button class="icon-btn">🔔</button>
    <a href="cookzer-messenger.html" style="text-decoration: none;"><button class="icon-btn">💬</button></a>
    <div class="avatar">--</div>
  </div>
</div>

<!-- Main content -->
<div class="main">
  <div class="discover-content">
    <h1 class="page-title">Discover & Compete</h1>
    
    <!-- Challenge Hero -->
    <div class="challenge-hero">
      <div class="challenge-badge">Weekly Challenge</div>
      <h2 class="challenge-title" id="challengeTitle">Loading…</h2>
      <p class="challenge-details" id="challengeDetails"></p>
      <button class="challenge-btn" id="joinBtn">Join the challenge</button>
    </div>

    <!-- Filters -->
    <div class="filters-section">
      <div class="filter-label">Filter recipes by category</div>
      <div class="filter-chips" id="filterChips">
        <div class="filter-chip active" data-category="">All</div>
        <div class="filter-chip" data-category="Breakfast">Breakfast</div>
        <div class="filter-chip" data-category="Lunch">Lunch</div>
        <div class="filter-chip" data-category="Dinner">Dinner</div>
        <div class="filter-chip" data-category="Dessert">Dessert</div>
        <div class="filter-chip" data-category="Baking">Baking</div>
        <div class="filter-chip" data-category="Appetizers">Appetizers</div>
        <div class="filter-chip" data-category="BBQ">BBQ</div>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="leaderboard-section">
      <div class="section-title">Top entries this week</div>
      <div id="leaderboardList"></div>
      <div id="leaderboardEmpty" class="entry-recipe" style="text-align:center; padding:20px;" hidden>No entries yet — be the first to join.</div>
    </div>

  </div>
</div>

<script>
  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.querySelector('.sidebar-overlay').classList.toggle('open');
  }

  let currentUser = null;
  let activeChallenge = null;
  let categoryFilter = '';

  async function loadChallenge() {
    const { data: challenges } = await sb
      .from('challenges')
      .select('id, title, description, ends_at')
      .order('created_at', { ascending: false })
      .limit(1);

    if (!challenges || challenges.length === 0) {
      document.getElementById('challengeTitle').textContent = 'No active challenge';
      return;
    }
    activeChallenge = challenges[0];
    document.getElementById('challengeTitle').textContent = activeChallenge.title;

    const { count: entryCount } = await sb
      .from('challenge_entries')
      .select('*', { count: 'exact', head: true })
      .eq('challenge_id', activeChallenge.id);

    const endsIn = Math.max(0, Math.ceil((new Date(activeChallenge.ends_at) - Date.now()) / 86400000));
    document.getElementById('challengeDetails').textContent = (entryCount || 0) + ' cooks entered so far • ends in ' + endsIn + 'd';

    const { data: mine } = await sb
      .from('challenge_entries')
      .select('id')
      .eq('challenge_id', activeChallenge.id)
      .eq('user_id', currentUser.id)
      .maybeSingle();

    const joinBtn = document.getElementById('joinBtn');
    joinBtn.textContent = mine ? 'Joined ✓' : 'Join the challenge';
    joinBtn.onclick = async () => {
      const { error } = await sb.from('challenge_entries').upsert(
        { challenge_id: activeChallenge.id, user_id: currentUser.id },
        { onConflict: 'challenge_id,user_id' }
      );
      if (error) {
        alert('Could not join: ' + error.message);
        return;
      }
      await loadChallenge();
    };

    await loadLeaderboard();
  }

  document.querySelectorAll('.filter-chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach((c) => c.classList.remove('active'));
      chip.classList.add('active');
      categoryFilter = chip.dataset.category || '';
      loadLeaderboard();
    });
  });

  async function loadLeaderboard() {
    if (!activeChallenge) return;
    const listEl = document.getElementById('leaderboardList');

    let query = sb
      .from('challenge_entries')
      .select('user_id, post_id, profiles(id, display_name, initials), posts(recipe_id, recipes(id, title, category))')
      .eq('challenge_id', activeChallenge.id)
      .not('post_id', 'is', null);

    const { data: entries } = await query;
    let filtered = entries || [];
    if (categoryFilter) {
      filtered = filtered.filter((e) => e.posts && e.posts.recipes && e.posts.recipes.category === categoryFilter);
    }

    if (filtered.length === 0) {
      listEl.innerHTML = '';
      document.getElementById('leaderboardEmpty').hidden = false;
      return;
    }
    document.getElementById('leaderboardEmpty').hidden = true;

    const withHearts = await Promise.all(filtered.map(async (e) => {
      const { count } = await sb.from('hearts').select('*', { count: 'exact', head: true }).eq('post_id', e.post_id);
      return { ...e, hearts: count || 0 };
    }));

    withHearts.sort((a, b) => b.hearts - a.hearts);
    const medals = ['🥇', '🥈', '🥉'];
    listEl.innerHTML = '';
    withHearts.forEach((e, i) => {
      const item = document.createElement('div');
      item.className = 'leaderboard-item';

      const rank = document.createElement('div');
      rank.className = 'rank-badge';
      rank.textContent = medals[i] || (i + 1);

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = e.profiles ? e.profiles.initials : '??';

      const content = document.createElement('div');
      content.className = 'entry-content';
      const name = document.createElement('div');
      name.className = 'entry-name';
      name.textContent = e.profiles ? e.profiles.display_name : 'Someone';
      const recipeLine = document.createElement('div');
      recipeLine.className = 'entry-recipe';
      if (e.posts && e.posts.recipes) {
        const link = document.createElement('a');
        link.href = 'cookzer-recipe.html?id=' + e.posts.recipes.id;
        link.style.color = 'inherit';
        link.textContent = e.posts.recipes.title;
        recipeLine.appendChild(link);
      } else {
        recipeLine.textContent = 'Entry post';
      }
      content.appendChild(name);
      content.appendChild(recipeLine);

      const hearts = document.createElement('div');
      hearts.className = 'entry-hearts';
      hearts.textContent = e.hearts + ' ❤️';

      item.appendChild(rank);
      item.appendChild(avatar);
      item.appendChild(content);
      item.appendChild(hearts);
      listEl.appendChild(item);
    });
  }

  (async function init() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;
    currentUser = user;
    await loadChallenge();
  })();
</script>
</body>
</html>
