<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>My Recipes — Cookzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth-guard.js"></script>
  <script src="theme.js"></script>
  <script src="shortcuts.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
  .brand-header {
      font-size: 20px;
      color: var(--olive-dark);
      letter-spacing: -0.5px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
    }

  .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--olive), var(--olive-dark));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 600; cursor: pointer;
    }

  /* Main content */
    .main {
      flex: 1;
      margin-top: 60px;
      overflow-y: auto;
    }

  .cookbook-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

  .page-title {
      font-size: 28px;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      color: var(--olive-dark);
      margin-bottom: 24px;
      text-align: center;
      width: 100%;
    }

  /* Folders section */
    .folders-section {
      width: 100%;
      max-width: 700px;
      margin-bottom: 32px;
    }

  .section-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

  .folders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

  .folder {
      background: linear-gradient(135deg, var(--mustard), #E8C055);
      color: #fff;
      padding: 16px;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-weight: 500;
      font-size: 14px;
    }

  .folder:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

  .folder.active {
      box-shadow: 0 0 0 3px var(--olive);
    }

  .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-soft);
    }

  .empty-state-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

  .empty-state-text {
      font-size: 14px;
      max-width: 320px;
      margin: 0 auto;
      line-height: 1.5;
    }

  .folder-icon {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
    }

  .folder.add-folder {
      background: var(--cream);
      border: 2px dashed var(--line);
      color: var(--ink-soft);
    }

  .folder.add-folder:hover { border-color: var(--olive); color: var(--olive); }

  /* Recently saved section */
    .recently-saved {
      width: 100%;
      max-width: 700px;
    }

  .recipe-item {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

  .recipe-item:hover {
      border-color: var(--mustard);
    }

  .recipe-thumb {
      width: 80px;
      height: 80px;
      border-radius: 14px;
      background: linear-gradient(135deg, #F3EEE3, #E5D9C8);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background-size: cover;
      background-position: center;
    }

  .recipe-content {
      flex: 1;
    }

  .recipe-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
      font-family: 'Fraunces', serif;
    }

  .recipe-note {
      font-size: 12px;
      color: var(--brick);
      font-weight: 500;
      margin-bottom: 8px;
      padding: 6px 10px;
      background: rgba(169, 78, 46, 0.08);
      border-radius: 10px;
      display: inline-block;
    }

  .recipe-folder {
      font-size: 12px;
      color: var(--ink-soft);
    }

  .recipe-actions {
      display: flex;
      gap: 8px;
      font-size: 16px;
    }

  .action-icon {
      cursor: pointer;
      transition: all 0.2s;
    }

  .action-icon:hover {
      transform: scale(1.2);
    }

  /* Responsive */
    @media (max-width: 900px) {
      .right-sidebar { display: none; }
    }

  @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        height: 100vh;
        z-index: 100;
        transition: left 0.25s ease;
      }
      .sidebar.open { left: 0; }
      .sidebar-overlay.open { display: block; }
      .menu-toggle { display: flex; }
      .header { left: 0; padding: 0 16px; gap: 12px; }
      .search-bar { display: none; }
      .main { margin-left: 0; }
      .brand-header { font-size: 18px; }
    }

  @media (max-width: 480px) {
      .header { padding: 0 12px; }
      .icon-btn, .avatar { width: 32px; height: 32px; font-size: 15px; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <a href="cookzer-feed.html" style="text-decoration:none;"><div class="sidebar-brand">Cook<span>zer</span></div></a>
  
  <a href="cookzer-feed.html" style="text-decoration: none;"><div class="sidebar-item icon feed">Feed</div></a>
  <a href="cookzer-cookbook.html" style="text-decoration: none;"><div class="sidebar-item icon cookbook active">My Recipes</div></a>
  <a href="cookzer-planner.html" style="text-decoration: none;"><div class="sidebar-item icon planner">Meal Planner</div></a>
  <a href="cookzer-health.html" style="text-decoration: none;"><div class="sidebar-item icon health">Health</div></a>
  <a href="cookzer-challenges.html" style="text-decoration: none;"><div class="sidebar-item icon challenges">Challenges</div></a>
  <a href="cookzer-groups.html" style="text-decoration: none;"><div class="sidebar-item icon groups">Groups</div></a>
  <a href="cookzer-restaurants.html" style="text-decoration: none;"><div class="sidebar-item icon restaurants">Restaurants</div></a>
  <a href="cookzer-profile.html" style="text-decoration: none;"><div class="sidebar-item icon profile">Profile</div></a>
  <a href="cookzer-messenger.html" style="text-decoration: none;"><div class="sidebar-item icon messenger">Messenger</div></a>
</div>

<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Header -->
<div class="header">
  <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
  <div class="brand-header">Cook<span>zer</span></div>
  <div class="header-right">
    <button class="icon-btn" id="notifBellBtn">🔔</button>
    <a href="cookzer-messenger.html" style="text-decoration: none;"><button class="icon-btn">💬</button></a>
    <button class="icon-btn theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark mode" type="button">🌙</button>
    <div class="avatar">--</div>
  </div>
</div>

<!-- Main content -->
<div class="main">
  <div class="cookbook-content">
    <h1 class="page-title">My Recipes</h1>
    
    <!-- Folders -->
    <div class="folders-section">
      <div class="section-label">Your folders</div>
      <div class="folders-grid" id="foldersGrid">
        <div class="folder add-folder" id="addFolderTile">
          <span class="folder-icon">+</span>
          New folder
        </div>
      </div>
    </div>

    <!-- Recently saved -->
    <div class="recently-saved">
      <div class="section-label">Recently saved</div>
      <div id="savedRecipesList"></div>
      <div id="savedEmpty" class="empty-state" hidden>
        <span class="empty-state-icon">🍽️</span>
        <div class="empty-state-text" id="savedEmptyText">Nothing saved yet — hit "Save to Cookbook" on any recipe page.</div>
      </div>
    </div>

  </div>
</div>

<script>
  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.querySelector('.sidebar-overlay').classList.toggle('open');
  }

  let currentUser = null;
  let folders = [];
  let activeFolderId = null;

  function publicUrl(bucket, path) {
    if (!path) return null;
    return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
  }

  async function loadFolders() {
    const { data } = await sb.from('cookbook_folders').select('id, name, emoji').eq('user_id', currentUser.id).order('created_at');
    folders = data || [];
    renderFolders();
  }

  function renderFolders() {
    const grid = document.getElementById('foldersGrid');
    grid.querySelectorAll('.folder:not(.add-folder)').forEach((el) => el.remove());
    const addTile = document.getElementById('addFolderTile');

    folders.forEach((f) => {
      const div = document.createElement('div');
      div.className = 'folder' + (f.id === activeFolderId ? ' active' : '');
      div.style.opacity = (activeFolderId && activeFolderId !== f.id) ? '0.6' : '1';
      div.innerHTML = '<span class="folder-icon"></span>';
      div.querySelector('.folder-icon').textContent = f.emoji;
      div.appendChild(document.createTextNode(f.name));
      div.addEventListener('click', () => {
        activeFolderId = activeFolderId === f.id ? null : f.id;
        renderFolders();
        loadSavedRecipes();
      });
      grid.insertBefore(div, addTile);
    });
  }

  document.getElementById('addFolderTile').addEventListener('click', async () => {
    const name = prompt('Folder name (e.g. Weeknight dinners):');
    if (!name || !name.trim()) return;
    const emoji = prompt('Pick an emoji for this folder (optional):', '📁') || '📁';
    const { error } = await sb.from('cookbook_folders').insert({ user_id: currentUser.id, name: name.trim(), emoji });
    if (error) {
      alert('Could not create folder: ' + error.message);
      return;
    }
    await loadFolders();
  });

  async function loadSavedRecipes() {
    let query = sb
      .from('saved_recipes')
      .select('recipe_id, folder_id, note, recipes(id, title, hero_photo_path)')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });

    if (activeFolderId) query = query.eq('folder_id', activeFolderId);

    const { data: saved } = await query;
    const listEl = document.getElementById('savedRecipesList');
    listEl.innerHTML = '';
    const isEmpty = !(saved && saved.length);
    document.getElementById('savedEmpty').hidden = !isEmpty;
    if (isEmpty) {
      const activeFolder = folders.find((f) => f.id === activeFolderId);
      document.getElementById('savedEmptyText').textContent = activeFolder
        ? 'This cookbook is empty — save a recipe here from any recipe page, or move one in with the 📁 icon below.'
        : 'Nothing saved yet — hit "Save to Cookbook" on any recipe page.';
    }

    (saved || []).forEach((s) => {
      if (!s.recipes) return;
      const folder = folders.find((f) => f.id === s.folder_id);
      const item = document.createElement('div');
      item.className = 'recipe-item';

      const thumb = document.createElement('div');
      thumb.className = 'recipe-thumb';
      const photoUrl = publicUrl('recipe-photos', s.recipes.hero_photo_path);
      if (photoUrl) {
        thumb.style.backgroundImage = "url('" + photoUrl + "')";
      } else {
        thumb.textContent = '🍽️';
      }

      const content = document.createElement('div');
      content.className = 'recipe-content';
      const titleLink = document.createElement('a');
      titleLink.href = 'cookzer-recipe.html?id=' + s.recipe_id;
      titleLink.style.textDecoration = 'none';
      titleLink.style.color = 'inherit';
      const title = document.createElement('div');
      title.className = 'recipe-title';
      title.textContent = s.recipes.title;
      titleLink.appendChild(title);
      content.appendChild(titleLink);

      if (s.note) {
        const note = document.createElement('div');
        note.className = 'recipe-note';
        note.textContent = '📝 ' + s.note;
        content.appendChild(note);
      }

      const folderLabel = document.createElement('div');
      folderLabel.className = 'recipe-folder';
      folderLabel.textContent = folder ? 'in ' + folder.name : 'not in a folder';
      content.appendChild(folderLabel);

      const actions = document.createElement('div');
      actions.className = 'recipe-actions';
      const noteBtn = document.createElement('span');
      noteBtn.className = 'action-icon';
      noteBtn.textContent = '📝';
      noteBtn.title = 'Edit note';
      noteBtn.addEventListener('click', async () => {
        const newNote = prompt('Note for this recipe:', s.note || '');
        if (newNote === null) return;
        await sb.from('saved_recipes').update({ note: newNote }).eq('user_id', currentUser.id).eq('recipe_id', s.recipe_id);
        await loadSavedRecipes();
      });
      const moveBtn = document.createElement('span');
      moveBtn.className = 'action-icon';
      moveBtn.textContent = '📁';
      moveBtn.title = 'Move to a cookbook';
      moveBtn.addEventListener('click', async () => {
        if (folders.length === 0) {
          alert('Create a cookbook folder first (the "+ New folder" tile above).');
          return;
        }
        const listText = folders.map((f, i) => (i + 1) + '. ' + f.emoji + ' ' + f.name).join('\n');
        const pick = prompt('Move to which cookbook? Enter a number, or 0 for no folder:\n' + listText, folder ? String(folders.indexOf(folder) + 1) : '0');
        if (pick === null) return;
        const idx = parseInt(pick, 10);
        const newFolderId = idx > 0 && folders[idx - 1] ? folders[idx - 1].id : null;
        await sb.from('saved_recipes').update({ folder_id: newFolderId }).eq('user_id', currentUser.id).eq('recipe_id', s.recipe_id);
        await loadSavedRecipes();
      });
      const removeBtn = document.createElement('span');
      removeBtn.className = 'action-icon';
      removeBtn.textContent = '🗑️';
      removeBtn.title = 'Remove from cookbook';
      removeBtn.addEventListener('click', async () => {
        await sb.from('saved_recipes').delete().eq('user_id', currentUser.id).eq('recipe_id', s.recipe_id);
        await loadSavedRecipes();
      });
      actions.appendChild(noteBtn);
      actions.appendChild(moveBtn);
      actions.appendChild(removeBtn);

      item.appendChild(thumb);
      item.appendChild(content);
      item.appendChild(actions);
      listEl.appendChild(item);
    });
  }

  (async function init() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;
    currentUser = user;
    await loadFolders();
    await loadSavedRecipes();
  })();
</script>
</body>
</html>
