<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#009246">
  <title>Meal Planner — Cookzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="notifications-shared.js"></script>
  <script src="auth-guard.js"></script>
  <script src="nutrition-data.js"></script>
  <script src="theme.js"></script>
  <script src="shortcuts.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
  .brand-header {
      font-size: 20px;
      color: var(--olive-dark);
      letter-spacing: -0.5px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
    }

  .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--olive), var(--olive-dark));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 600; cursor: pointer;
    }

  /* Main content */
    .main {
      flex: 1;
      margin-top: 60px;
      overflow-y: auto;
    }

  .planner-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

  .page-title {
      font-size: 28px;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      color: var(--olive-dark);
      margin-bottom: 24px;
      text-align: center;
      width: 100%;
    }

  /* Planner grid */
    .planner-grid {
      width: 100%;
      max-width: 700px;
    }

  .planner-day {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s;
    }

  .planner-day:hover {
      border-color: var(--mustard);
    }

  .day-label {
      font-weight: 600;
      color: var(--brick);
      min-width: 50px;
      font-size: 14px;
    }

  .meal-slot {
      flex: 1;
    }

  .meal-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 4px;
    }

  .meal-source {
      font-size: 12px;
      color: var(--ink-soft);
    }

  .meal-add-btn {
      padding: 8px 16px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--olive);
      transition: all 0.2s;
    }

  .meal-add-btn:hover {
      background: #f0e6d2;
      border-color: var(--olive);
    }

  .empty-meal {
      color: var(--ink-soft);
      font-style: italic;
    }

  .meal-remove-btn {
      background: none; border: none; color: var(--ink-soft); font-size: 16px; cursor: pointer;
    }

  .drag-handle {
      color: var(--ink-soft);
      font-size: 16px;
      cursor: grab;
      padding: 0 2px;
      line-height: 1;
    }

  .planner-day.dragging {
      opacity: 0.4;
    }

  .planner-day.drag-over {
      border-color: var(--olive);
      box-shadow: 0 0 0 2px var(--olive) inset;
    }

  .shopping-list { text-align: left; background: var(--cream); border-radius: 14px; padding: 14px; margin-bottom: 16px; }

  .shopping-list-item { font-size: 13px; padding: 4px 0; color: var(--ink); border-bottom: 1px solid var(--line); }

  .shopping-list-item:last-child { border-bottom: none; }

  /* Cart section */
    .cart-section {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      border: 2px solid var(--mustard);
      border-radius: 18px;
      padding: 20px;
      margin-top: 32px;
      text-align: center;
    }

  .cart-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--olive-dark);
      margin-bottom: 8px;
      font-family: 'Fraunces', serif;
    }

  .cart-description {
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 16px;
      line-height: 1.6;
    }

  .ingredient-count {
      background: var(--cream);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--olive-dark);
    }

  .cart-btn {
      background: var(--olive);
      color: #fff;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

  .cart-btn:hover {
      background: var(--olive-dark);
      transform: translateY(-2px);
    }

  /* Responsive */
    @media (max-width: 900px) {
      .right-sidebar { display: none; }
    }

  @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        height: 100vh;
        height: 100dvh;
        z-index: 100;
        transition: left 0.25s ease;
      }
      .sidebar.open { left: 0; }
      .sidebar-overlay.open { display: block; }
      .menu-toggle { display: flex; }
      .header { left: 0; padding: 0 16px; gap: 12px; }
      .search-bar { display: none; }
      .main { margin-left: 0; }
      .brand-header { font-size: 18px; }
    }

  @media (max-width: 480px) {
      .header { padding: 0 12px; }
      .icon-btn, .avatar { width: 32px; height: 32px; font-size: 15px; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <a href="cookzer-feed.html" style="text-decoration:none;"><div class="sidebar-brand">Cook<span>zer</span></div></a>
  
  <a href="cookzer-feed.html" style="text-decoration: none;"><div class="sidebar-item icon feed">Feed</div></a>
  <a href="cookzer-cookbook.html" style="text-decoration: none;"><div class="sidebar-item icon cookbook">My Recipes</div></a>
  <a href="cookzer-planner.html" style="text-decoration: none;"><div class="sidebar-item icon planner active">Meal Planner</div></a>
  <a href="cookzer-health.html" style="text-decoration: none;"><div class="sidebar-item icon health">Health</div></a>
  <a href="cookzer-pantry.html" style="text-decoration: none;"><div class="sidebar-item icon pantry">Pantry Challenge</div></a>
  <a href="cookzer-challenges.html" style="text-decoration: none;"><div class="sidebar-item icon challenges">Challenges</div></a>
  <a href="cookzer-groups.html" style="text-decoration: none;"><div class="sidebar-item icon groups">Groups</div></a>
  <a href="cookzer-restaurants.html" style="text-decoration: none;"><div class="sidebar-item icon restaurants">Restaurants</div></a>
  <a href="cookzer-profile.html" style="text-decoration: none;"><div class="sidebar-item icon profile">Profile</div></a>
  <a href="cookzer-messenger.html" style="text-decoration: none;"><div class="sidebar-item icon messenger">Messenger</div></a>
</div>

<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Header -->
<div class="header">
  <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
  <div class="brand-header">Cook<span>zer</span></div>
  <div class="header-right">
    <button class="icon-btn" id="notifBellBtn">🔔</button>
    <a href="cookzer-messenger.html" style="text-decoration: none;"><button class="icon-btn">💬</button></a>
    <button class="icon-btn theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark mode" type="button">🌙</button>
    <a href="cookzer-settings.html" style="text-decoration:none;"><button class="icon-btn" title="Settings" type="button">⚙️</button></a>
    <div class="avatar">--</div>
  </div>
</div>

<!-- Main content -->
<div class="main">
  <div class="planner-content">
    <h1 class="page-title">This week's plan</h1>

    <div style="width:100%; max-width:700px; display:flex; justify-content:flex-end; margin-bottom:12px;">
      <button class="meal-add-btn" id="copyLastWeekBtn" type="button">📋 Copy last week's plan</button>
    </div>

    <div class="planner-grid" id="plannerGrid"></div>

    <!-- Weekly nutrition summary -->
    <div class="cart-section" id="nutritionSummaryBox" hidden>
      <div class="cart-title">This week's nutrition</div>
      <div class="ingredient-count" id="nutritionSummaryText"></div>
    </div>

    <!-- Shopping list (Phase 4) -->
    <div class="cart-section">
      <div class="cart-title">This week's basket</div>
      <div class="cart-description">Generate a consolidated shopping list from every planned meal that has a real recipe attached.</div>
      <div id="shoppingListBox"></div>
      <button class="cart-btn" id="generateListBtn">Generate shopping list</button>
    </div>
  </div>
</div>

<script>
  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.querySelector('.sidebar-overlay').classList.toggle('open');
  }

  let currentUser = null;
  const DAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function mondayOfThisWeek() {
    const now = new Date();
    const day = now.getDay(); // 0 = Sun
    const diff = day === 0 ? -6 : 1 - day;
    const monday = new Date(now);
    monday.setHours(0, 0, 0, 0);
    monday.setDate(now.getDate() + diff);
    return monday;
  }

  function weekDates() {
    const monday = mondayOfThisWeek();
    return DAY_LABELS.map((_, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      return d.toISOString().slice(0, 10);
    });
  }

  let entriesByDate = {};

  function lastWeekDates() {
    return weekDates().map((d) => {
      const date = new Date(d + 'T00:00:00');
      date.setDate(date.getDate() - 7);
      return date.toISOString().slice(0, 10);
    });
  }

  document.getElementById('copyLastWeekBtn').addEventListener('click', async () => {
    const thisWeek = weekDates();
    const lastWeek = lastWeekDates();

    const { data: lastWeekEntries } = await sb
      .from('meal_plan_entries')
      .select('plan_date, recipe_id, free_text, source_note')
      .eq('user_id', currentUser.id)
      .in('plan_date', lastWeek);

    if (!lastWeekEntries || lastWeekEntries.length === 0) {
      alert('No planned meals found for last week to copy.');
      return;
    }

    const toInsert = lastWeekEntries
      .filter((e) => !entriesByDate[thisWeek[lastWeek.indexOf(e.plan_date)]])
      .map((e) => ({
        user_id: currentUser.id,
        plan_date: thisWeek[lastWeek.indexOf(e.plan_date)],
        recipe_id: e.recipe_id,
        free_text: e.free_text,
        source_note: e.source_note,
      }));

    if (toInsert.length === 0) {
      alert('This week already has meals planned on every day last week had one.');
      return;
    }

    const { error } = await sb.from('meal_plan_entries').insert(toInsert);
    if (error) {
      alert('Could not copy last week: ' + error.message);
      return;
    }
    await loadWeek();
  });

  async function loadWeek() {
    const dates = weekDates();
    const { data } = await sb
      .from('meal_plan_entries')
      .select('id, plan_date, recipe_id, free_text, source_note, recipes(id, title, nutrition)')
      .eq('user_id', currentUser.id)
      .in('plan_date', dates);

    entriesByDate = {};
    (data || []).forEach((e) => {
      entriesByDate[e.plan_date] = e;
    });

    renderWeek(dates);
    renderNutritionSummary(data || []);
  }

  function renderNutritionSummary(entries) {
    const withNutrition = entries.filter((e) => e.recipes && e.recipes.nutrition && e.recipes.nutrition.calories);
    const box = document.getElementById('nutritionSummaryBox');
    if (withNutrition.length === 0) {
      box.hidden = true;
      return;
    }
    const totals = withNutrition.reduce((sum, e) => {
      const n = e.recipes.nutrition;
      sum.calories += n.calories || 0;
      sum.protein += n.protein || 0;
      sum.carbs += n.carbs || 0;
      sum.fat += n.fat || 0;
      return sum;
    }, { calories: 0, protein: 0, carbs: 0, fat: 0 });

    box.hidden = false;
    document.getElementById('nutritionSummaryText').textContent =
      '🔥 ' + totals.calories + ' kcal · 🥩 ' + totals.protein + 'g protein · 🍞 ' + totals.carbs + 'g carbs · 🥑 ' + totals.fat + 'g fat' +
      ' — across ' + withNutrition.length + ' planned ' + (withNutrition.length === 1 ? 'meal' : 'meals') + ' with nutrition data.';
  }

  function renderWeek(dates) {
    const grid = document.getElementById('plannerGrid');
    grid.innerHTML = '';

    dates.forEach((date, i) => {
      const entry = entriesByDate[date];
      const row = document.createElement('div');
      row.className = 'planner-day';
      row.dataset.date = date;

      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', async (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const sourceDate = e.dataTransfer.getData('text/plain');
        if (!sourceDate || sourceDate === date) return;
        await swapMeals(sourceDate, date);
      });

      if (entry) {
        const handle = document.createElement('span');
        handle.className = 'drag-handle';
        handle.textContent = '⠿';
        handle.draggable = true;
        handle.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', date);
          e.dataTransfer.effectAllowed = 'move';
          row.classList.add('dragging');
        });
        handle.addEventListener('dragend', () => row.classList.remove('dragging'));
        row.appendChild(handle);
      }

      const label = document.createElement('div');
      label.className = 'day-label';
      label.textContent = DAY_LABELS[i];
      row.appendChild(label);

      const slot = document.createElement('div');
      slot.className = 'meal-slot';

      if (entry) {
        const name = document.createElement('div');
        name.className = 'meal-name';
        if (entry.recipes) {
          const link = document.createElement('a');
          link.href = 'cookzer-recipe.html?id=' + entry.recipe_id;
          link.style.color = 'inherit';
          link.style.textDecoration = 'none';
          link.textContent = entry.recipes.title;
          name.appendChild(link);
        } else {
          name.textContent = entry.free_text || 'Planned meal';
        }
        const source = document.createElement('div');
        source.className = 'meal-source';
        source.textContent = entry.source_note || (entry.recipes ? 'from your recipes' : '');
        slot.appendChild(name);
        slot.appendChild(source);
        row.appendChild(slot);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'meal-remove-btn';
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', async () => {
          await sb.from('meal_plan_entries').delete().eq('id', entry.id);
          await loadWeek();
        });
        row.appendChild(removeBtn);
      } else {
        const empty = document.createElement('div');
        empty.className = 'empty-meal';
        empty.textContent = 'Not planned yet';
        slot.appendChild(empty);
        row.appendChild(slot);

        const addBtn = document.createElement('button');
        addBtn.className = 'meal-add-btn';
        addBtn.textContent = '+ Add meal';
        addBtn.addEventListener('click', () => openAddMeal(date));
        row.appendChild(addBtn);
      }

      grid.appendChild(row);
    });
  }

  async function swapMeals(sourceDate, targetDate) {
    const sourceEntry = entriesByDate[sourceDate];
    const targetEntry = entriesByDate[targetDate];
    if (!sourceEntry) return;

    if (targetEntry) {
      await sb.from('meal_plan_entries').update({ plan_date: targetDate }).eq('id', sourceEntry.id);
      await sb.from('meal_plan_entries').update({ plan_date: sourceDate }).eq('id', targetEntry.id);
    } else {
      await sb.from('meal_plan_entries').update({ plan_date: targetDate }).eq('id', sourceEntry.id);
    }
    await loadWeek();
  }

  async function openAddMeal(date) {
    const { data: recipes } = await sb
      .from('recipes')
      .select('id, title')
      .or('author_id.eq.' + currentUser.id)
      .order('created_at', { ascending: false })
      .limit(20);

    let choice = null;
    if (recipes && recipes.length > 0) {
      const listText = recipes.map((r, i) => (i + 1) + '. ' + r.title).join('\n');
      const pick = prompt('Pick a recipe by number, or type a plain meal name:\n' + listText);
      if (pick === null) return;
      const idx = parseInt(pick, 10) - 1;
      if (!isNaN(idx) && recipes[idx]) {
        choice = { recipe_id: recipes[idx].id };
      } else if (pick.trim()) {
        choice = { free_text: pick.trim() };
      }
    } else {
      const text = prompt('What are you planning to cook? (create recipes to attach real ones)');
      if (!text || !text.trim()) return;
      choice = { free_text: text.trim() };
    }
    if (!choice) return;

    const { error } = await sb.from('meal_plan_entries').insert({
      user_id: currentUser.id,
      plan_date: date,
      ...choice,
    });
    if (error) {
      alert('Could not add meal: ' + error.message);
      return;
    }
    await loadWeek();
  }

  document.getElementById('generateListBtn').addEventListener('click', async () => {
    const dates = weekDates();
    const { data: entries } = await sb
      .from('meal_plan_entries')
      .select('recipe_id, recipes(ingredients)')
      .eq('user_id', currentUser.id)
      .in('plan_date', dates)
      .not('recipe_id', 'is', null);

    const box = document.getElementById('shoppingListBox');
    if (!entries || entries.length === 0) {
      box.innerHTML = '<div class="ingredient-count">No planned meals have a recipe attached yet — add one from your recipes.</div>';
      return;
    }

    const combined = {};
    entries.forEach((e) => {
      (e.recipes && e.recipes.ingredients || []).forEach((ing) => {
        const name = (ing.name || '').trim();
        if (!name) return;
        if (!combined[name]) combined[name] = [];
        if (ing.qty) combined[name].push(ing.qty);
      });
    });

    const names = Object.keys(combined);
    if (names.length === 0) {
      box.innerHTML = '<div class="ingredient-count">Those recipes don\'t have ingredients listed yet.</div>';
      return;
    }

    const list = document.createElement('div');
    list.className = 'shopping-list';
    names.forEach((name) => {
      const row = document.createElement('div');
      row.className = 'shopping-list-item';
      const qtys = combined[name];
      row.textContent = name + (qtys.length ? ' — ' + qtys.join(' + ') : '');
      list.appendChild(row);
    });

    // Estimated total: sum each planned recipe's own ingredient cost
    // (servings forced to 1 so it's the whole-recipe total, not
    // per-serving) rather than trying to re-parse the merged "2 cups +
    // 1 cup"-style rows above, which aren't in a form the lookup table
    // can add together.
    if (window.CookzerNutrition) {
      let total = 0;
      let anyMatched = false;
      entries.forEach((e) => {
        const cost = window.CookzerNutrition.estimateCostForRecipe({ ingredients: (e.recipes && e.recipes.ingredients) || [], servings: 1 });
        if (cost != null) { total += cost; anyMatched = true; }
      });
      if (anyMatched) {
        const totalRow = document.createElement('div');
        totalRow.className = 'shopping-list-item';
        totalRow.style.fontWeight = '700';
        totalRow.style.borderTop = '2px solid var(--line)';
        totalRow.style.marginTop = '4px';
        totalRow.style.paddingTop = '10px';
        totalRow.innerHTML = 'Estimated total: ~$' + total.toFixed(2) +
          ' <span style="font-weight:400; color:var(--ink-soft); font-size:12px;">(from a lookup-table estimate, not real prices)</span>';
        list.appendChild(totalRow);
      }
    }

    box.innerHTML = '';
    box.appendChild(list);
  });

  (async function init() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;
    currentUser = user;
    await loadWeek();
  })();
</script>
</body>
